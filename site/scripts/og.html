<!doctype html>
<!--
  The 1200×630 social card. `bun scripts/assets.ts og` fills the SCREEN placeholder (inicio, Creme, 750 px) and
  the DUA one (avatar-ola) and screenshots it into static/og.png. Colours are the Creme tokens from
  src/lib/styles/theme.css; the fonts are inlined because setContent pages can't load file:// URLs.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Figtree';
        font-weight: 300 900;
        src: url(data:font/woff2;base64,@@FIGTREE@@) format('woff2');
      }
      @font-face {
        font-family: 'Space Grotesk';
        font-weight: 300 700;
        src: url(data:font/woff2;base64,@@GROTESK@@) format('woff2');
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: italic;
        font-weight: 400;
        src: url(data:font/woff2;base64,@@SERIF@@) format('woff2');
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background:
          radial-gradient(900px 520px at 12% -10%, #fffdf8 0%, transparent 60%),
          linear-gradient(180deg, #fff6ea 0%, #fde7d4 100%);
        color: #123c32;
        font-family: 'Figtree', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* ── left: the words ── */
      .copy {
        position: absolute;
        left: 80px;
        top: 64px;
        bottom: 64px;
        width: 600px;
        display: flex;
        flex-direction: column;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font:
          700 34px/1 'Space Grotesk',
          sans-serif;
        letter-spacing: -0.035em;
      }
      .logo svg {
        width: 36px;
        height: 36px;
      }
      .logo .dot {
        color: #123c32;
      }
      h1 {
        margin-top: auto;
        font:
          600 78px/0.98 'Space Grotesk',
          sans-serif;
        letter-spacing: -0.045em;
      }
      h1 em {
        position: relative;
        display: inline-block;
        padding: 0 4px 0 2px;
        font:
          italic 400 92px/0.9 'Instrument Serif',
          Georgia,
          serif;
        letter-spacing: -0.01em;
        z-index: 0;
      }
      /* the lime highlighter stroke under "viva": the one live thing in the words */
      h1 em::after {
        content: '';
        position: absolute;
        left: -2px;
        right: -6px;
        bottom: 6px;
        height: 24px;
        border-radius: 12px 6px 14px 8px;
        background: #d9f875;
        transform: rotate(-1.5deg);
        z-index: -1;
      }
      .lede {
        margin-top: 22px;
        max-width: 500px;
        font-size: 25px;
        line-height: 1.4;
        color: #4f6a5e;
      }
      .foot {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 36px;
      }
      .soon {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 58px;
        padding: 0 22px;
        border-radius: 16px;
        background: #123c32;
        color: #fffdf8;
        font-weight: 650;
        font-size: 22px;
        box-shadow:
          0 1px 2px rgb(18 60 50 / 0.06),
          0 4px 16px rgb(18 60 50 / 0.08);
      }
      .soon .from {
        font-weight: 450;
        color: #d9f875;
      }
      .for {
        font-size: 18px;
        line-height: 1.3;
        color: #4f6a5e;
      }

      /* ── right: the phone, rising out of the bottom edge ── */
      .glow {
        position: absolute;
        right: -40px;
        top: 60px;
        width: 620px;
        height: 620px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgb(217 248 117 / 0.85) 0%,
          rgb(217 248 117 / 0.32) 38%,
          transparent 68%
        );
      }
      .phone {
        position: absolute;
        right: 116px;
        top: 54px;
        width: 336px;
        padding: 11px;
        border-radius: 54px;
        background: linear-gradient(150deg, #34413b 0%, #121a16 45%, #0b100d 100%);
        box-shadow:
          inset 0 0 0 1.5px rgb(255 255 255 / 0.08),
          0 8px 16px rgb(18 60 50 / 0.14),
          0 30px 70px rgb(18 60 50 / 0.26);
        transform: rotate(4deg);
        transform-origin: 50% 100%;
      }
      .screen {
        position: relative;
        overflow: hidden;
        border-radius: 44px;
        background: #f7f4ea;
      }
      .island {
        position: absolute;
        z-index: 2;
        top: 9px;
        left: 50%;
        width: 30%;
        height: 25px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #050807;
      }
      .status {
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 26px 0 38px;
        font:
          600 14.5px/1 system-ui,
          sans-serif;
      }
      .icons {
        width: 50px;
        height: 12px;
        background:
          linear-gradient(#123c32, #123c32) 0 100% / 4px 40% no-repeat,
          linear-gradient(#123c32, #123c32) 6px 100% / 4px 65% no-repeat,
          linear-gradient(#123c32, #123c32) 12px 100% / 4px 90% no-repeat,
          linear-gradient(#123c32, #123c32) 100% 50% / 22px 100% no-repeat;
        border-radius: 1px;
        opacity: 0.9;
      }
      .screen img {
        display: block;
        width: 100%;
      }
      .dua {
        position: absolute;
        right: 408px;
        bottom: -8px;
        width: 196px;
        filter: drop-shadow(0 14px 18px rgb(18 60 50 / 0.2));
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>

    <div class="phone">
      <div class="screen">
        <span class="island"></span>
        <div class="status"><span>9:41</span><span class="icons"></span></div>
        <img src="{{SCREEN}}" alt="" />
      </div>
    </div>
    <img class="dua" src="{{DUA}}" alt="" />

    <div class="copy">
      <div class="logo">
        <svg viewBox="0 0 128 128" aria-hidden="true">
          <path
            d="M32 48 L61 88 L98 34"
            fill="none"
            stroke="#123c32"
            stroke-width="17"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span>venduá<span class="dot">.</span></span>
      </div>
      <h1>Sua loja <em>viva</em><br />na palma da mão.</h1>
      <p class="lede">A loja online com a sua cara e o app para tocar o dia.</p>
      <div class="foot">
        <span class="soon"><span class="from">a partir de</span> R$ 39,90/mês</span>
        <span class="for">Para doceiras, marmitarias,<br />hamburguerias e padarias.</span>
      </div>
    </div>
  </body>
</html>
