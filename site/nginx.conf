# Venduá — nginx for the static SvelteKit build (adapter-static).
# Dokploy: Application type "Dockerfile", container port 80, Traefik terminates TLS.

# Cache policy by path. Only /_app/immutable/ is content-hashed by Vite, so it is
# the sole immutable tree: /assets/ ships fixed filenames (favicon, social card)
# that change between releases, and HTML revalidates so deploys go live at once.
map $uri $vendua_cache_control {
    ~*^/_app/immutable/  "public, max-age=31536000, immutable";
    ~*^/assets/          "public, max-age=86400";
    default              "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    # stdout/stderr so the container's json-file log driver captures them.
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Behind Traefik / port mappings: relative redirects keep the public host/port.
    absolute_redirect off;
    port_in_redirect off;

    # adapter-static emits precompressed .gz; plain gzip covers files written
    # after the build (robots.txt, sitemap.xml, 404.html).
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/rss+xml
        application/manifest+json
        image/svg+xml;

    # Single add_header site: any add_header inside a location would drop the rest.
    add_header Cache-Control $vendua_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # trailingSlash 'always': /contato/ -> contato/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    # The error page answers 404 for real misses; requesting it directly is itself a miss.
    location = /404.html {
        internal;
    }
}
