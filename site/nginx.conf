# nginx for the adapter-static SvelteKit build; Dokploy "Dockerfile" app on :80, Traefik terminates TLS.
# Only /_app/immutable/ is content-hashed; /assets/ ships fixed filenames and HTML revalidates so deploys go live at once.
# Log only failures — 2xx/3xx lines are one per asset/API call and drown the rest
# (core logs its own mutations and errors).
map $status $vendua_loggable {
    ~^[23]  0;
    default 1;
}

map $uri $vendua_cache_control {
    ~*^/_app/immutable/  "public, max-age=31536000, immutable";
    ~*^/assets/          "public, max-age=86400";
    /precos.json         "public, max-age=60";
    default              "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    # stdout/stderr so the container's log driver captures them
    access_log /dev/stdout combined if=$vendua_loggable;
    error_log /dev/stderr warn;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # relative redirects keep the public host/port behind Traefik / port mappings
    absolute_redirect off;
    port_in_redirect off;

    # adapter-static emits precompressed .gz; plain gzip covers post-build files (robots.txt, sitemap.xml, 404.html)
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/rss+xml
        application/manifest+json
        image/svg+xml;

    # single add_header site — an add_header inside a location would drop the rest
    add_header Cache-Control $vendua_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Docker DNS: resolve `core` per request so recreates don't leave a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # privacy-first page views (Core's collector, /privacidade/): first-party, POST only
    location = /analytics/v1/collect {
        limit_except POST { deny all; }
        set $core_upstream http://core:8787;
        proxy_pass $core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # the plans as the CRM has them (prices, trial, Duá, what is open), read on the home page
    # (src/lib/plans/live.svelte.ts): first-party like the counter, GET only; one minute of cache
    location = /precos.json {
        limit_except GET { deny all; }
        set $core_upstream http://core:8787;
        rewrite ^ /site/v1/plans break;
        proxy_pass $core_upstream;
        proxy_http_version 1.1;
        proxy_hide_header Cache-Control;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # trailingSlash 'always': /contato/ -> contato/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    # The error page answers 404 for real misses; requesting it directly is itself a miss.
    location = /404.html {
        internal;
    }
}
