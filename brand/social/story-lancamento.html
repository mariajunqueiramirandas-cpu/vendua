<!doctype html>
<!--
  Instagram Story (1080×1920): the official launch is weeks away. `bun brand/social/render.ts`
  writes story-lancamento.png. Creme tokens from site/src/lib/styles/theme.css; Duá is
  brand/mascote/publicar.webp, never mirrored. No date and no price: the owner hasn't set them.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Figtree';
        font-weight: 300 900;
        src: url(../../site/node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2)
          format('woff2');
      }
      @font-face {
        font-family: 'Space Grotesk';
        font-weight: 300 700;
        src: url(../../site/node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2)
          format('woff2');
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      body {
        position: relative;
        background:
          radial-gradient(1100px 760px at 10% -6%, #fffdf8 0%, transparent 62%),
          linear-gradient(180deg, #fff8ee 0%, #fff1e2 48%, #fde3cd 100%);
        color: #123c32;
        font-family: 'Figtree', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.05;
        mix-blend-mode: multiply;
        pointer-events: none;
      }

      /* ── the words ── */
      .copy {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 276px;
      }
      h1 {
        font:
          600 198px/0.9 'Space Grotesk',
          sans-serif;
        letter-spacing: -0.05em;
        margin-left: -8px;
      }
      .when {
        margin-top: 34px;
        font:
          600 68px/1.04 'Space Grotesk',
          sans-serif;
        letter-spacing: -0.035em;
      }
      .lede {
        margin-top: 28px;
        max-width: 900px;
        font-size: 41px;
        line-height: 1.34;
        font-weight: 500;
        color: #4f6a5e;
      }

      /* ── the sun coming up behind Duá ── */
      .sun {
        position: absolute;
        left: 150px;
        top: 950px;
        width: 860px;
        height: 860px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgb(217 248 117 / 0.9) 0%,
          rgb(217 248 117 / 0.42) 36%,
          rgb(217 248 117 / 0) 68%
        );
      }

      /* ── the name, with Duá planting the flag behind it ── */
      .word {
        position: absolute;
        left: 60px;
        bottom: 300px;
        font:
          700 262px/0.8 'Space Grotesk',
          sans-serif;
        letter-spacing: -0.06em;
        white-space: nowrap;
        z-index: 2;
      }
      /* Duá stands on the x-height of the name (feet are 92.7% down his 640 px image) */
      .dua {
        position: absolute;
        z-index: 1;
        left: 330px;
        top: calc(1475px - 0.927 * 500px);
        width: 500px;
        filter: drop-shadow(0 10px 18px rgb(18 60 50 / 0.22));
      }
      .site {
        position: absolute;
        right: 72px;
        bottom: 258px;
        font:
          600 36px/1 'Figtree',
          sans-serif;
        letter-spacing: -0.01em;
        color: #4f6a5e;
      }
    </style>
  </head>
  <body>
    <svg class="grain" width="1080" height="1920" aria-hidden="true">
      <filter id="n">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.9"
          numOctaves="2"
          seed="7"
          stitchTiles="stitch"
        />
        <feColorMatrix type="saturate" values="0" />
      </filter>
      <rect width="100%" height="100%" filter="url(#n)" />
    </svg>

    <div class="copy">
      <h1>Falta<br />pouco.</h1>
      <p class="when">Lançamento oficial<br />nas próximas semanas.</p>
      <p class="lede">
        Loja online, pedidos, Pix, tela da cozinha e o Duá,<br />o vendedor com IA no WhatsApp da
        loja.<br />Tudo num lugar só.
      </p>
    </div>

    <div class="sun"></div>

    <img class="dua" src="../mascote/publicar.webp" alt="" />
    <div class="word">venduá.</div>
    <div class="site">vendua.com.br</div>
  </body>
</html>
