# Venduá storefront — static SPA + API proxy to the internal `core` service.
# Tenant resolution rides on the Host header, so the proxy forwards it
# untouched; the public domain must be registered in the `domains` table.

map $uri $vendua_cache_control {
    # Vite fingerprints build assets — safe to cache forever.
    ~*^/assets/          "public, max-age=31536000, immutable";
    default              "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    # stdout/stderr so the container's json-file log driver captures them.
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Behind Traefik: relative redirects keep the public host/port.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $vendua_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Reserved API mounts — same prefixes the vite dev proxies forward.
    location ~ ^/(checkout/v1|storefront/v1|v1)(/|$) {
        proxy_pass http://core:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — client routes (/checkout, /pedido/:id, ...) resolve to
    # index.html; missing assets 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
