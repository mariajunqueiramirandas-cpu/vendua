# every store in one container: Core says which store a Host is (auth_request to
# /storefront/v1/_bundle, cached briefly) and nginx serves stores/<slug>/ — or
# stores/_default/ (the template bundle) when that store has no bundle of its own.
# API prefixes proxy to `core` with Host untouched, as in nginx.conf.

# Log only failures — 2xx/3xx lines are one per asset/API call and drown the rest
# (core logs its own mutations and errors).
map $status $vendua_loggable {
    ~^[23]  0;
    default 1;
}

map $uri $vendua_cache_control {
    # Vite fingerprints build assets — safe to cache forever.
    ~*^/assets/          "public, max-age=31536000, immutable";
    default              "no-cache";
}

# a slug is [a-z0-9-]; anything else (or no store) never reaches the filesystem path.
# A map, not `if`: `if` in a location drops try_files.
map $vendua_store_raw $vendua_store {
    ~^[a-z0-9-]+$ $vendua_store_raw;
    default       _default;
}

proxy_cache_path /var/cache/nginx/bundle levels=1 keys_zone=vendua_bundle:1m max_size=10m inactive=10m;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    # stdout/stderr so the container's json-file log driver captures them.
    access_log /dev/stdout combined if=$vendua_loggable;
    error_log /dev/stderr warn;
    root /usr/share/nginx/stores;
    charset utf-8;
    server_tokens off;

    # Behind Traefik: relative redirects keep the public host/port.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $vendua_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Reserved API mounts — same prefixes the vite dev proxies forward.
    # The merchant admin is not here: it lives on its own domain (the `admin` service),
    # away from scripts the storefront loads.
    location ~ ^/(checkout/v1|storefront/v1|v1)(/|$) {
        proxy_pass http://core:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_vendua_bundle {
        internal;
        proxy_pass http://core:8787/storefront/v1/_bundle;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache vendua_bundle;
        proxy_cache_key $host;
        proxy_cache_valid 204 30s;
        proxy_ignore_headers Cache-Control;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    # SPA fallback, per store
    location / {
        auth_request /_vendua_bundle;
        auth_request_set $vendua_store_raw $upstream_http_x_vendua_store;
        try_files /$vendua_store$uri /$vendua_store/index.html /_default$uri /_default/index.html =404;
    }
}
