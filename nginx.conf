# Venduá — nginx for the static SvelteKit build (adapter-static).
# Dokploy: Application type "Dockerfile", container port 80, Traefik terminates TLS.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Behind Traefik / port mappings: relative redirects keep the public host/port.
    absolute_redirect off;
    port_in_redirect off;

    # adapter-static emits precompressed .gz/.br
    gzip_static on;

    # trailingSlash 'always': /contato/ -> contato/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
