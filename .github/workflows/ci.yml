name: ci

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled rerun the pipeline so storefront-isolation can't go
    # stale — adding/removing a storefront: label changes what the check
    # enforces on the same head commit.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  # Runs prettier --write and commits style-only diffs back to the branch, so
  # formatting can never be the reason a change is blocked. Same-repo branches
  # only: a fork's head_ref doesn't exist in this repo (checkout would fail)
  # and the token can't push to forks anyway. This job is the only holder of
  # a write token; validation stays read-only.
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.fork == false &&
        !contains(fromJSON('["labeled","unlabeled"]'), github.event.action))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write . --log-level warn
      - name: Commit formatting fix
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'style: prettier auto-fix [skip ci]'
            git push
          fi

  # Storefront write-scope boundary (docs/architecture/06-monorepo.md): a PR
  # labelled `storefront:<slug>` may only touch `storefronts/<slug>/**`. No
  # `storefront:` label → no-op pass, so platform PRs don't need labels.
  # The only job gated on label events: labeled/unlabeled MUST rerun it (the
  # whole point of the trigger above); check/format skip those events since
  # the head commit is unchanged.
  storefront-isolation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the check diffs origin/<base>...HEAD
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun tools/check-storefront-paths.mjs

  # Validates GitHub's merge ref (PR) / the pushed commit (main) — the code
  # that will actually land.
  check:
    runs-on: ubuntu-latest
    # Label events only matter to storefront-isolation — check/format run the
    # same unchanged head commit.
    if: >-
      github.event_name == 'push' ||
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tools/affected.mjs diffs origin/<base>...HEAD on PRs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: |
          # Every workspace dir with a `check` script — a new package or
          # storefront needs zero CI edits.
          for dir in packages/* site storefronts/* storefronts/_examples/*; do
            [ -d "$dir" ] || continue
            [ -f "$dir/package.json" ] || continue
            if jq -e '.scripts.check' "$dir/package.json" > /dev/null; then
              echo "check $dir"
              (cd "$dir" && bun run check)
            fi
          done
      - name: Core tests
        run: cd packages/core && bun test
      - name: Isolation tools tests
        run: bun test tools/
      - name: Builds
        run: |
          # Storefront builds follow the affected graph (tools/affected.mjs)
          # against the PR base; a push to main builds every storefront.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            affected="$(bun tools/affected.mjs --base "origin/${{ github.base_ref }}")"
          else
            affected='{"packages":["site"],"allStorefronts":true}'
          fi
          echo "$affected"
          targets="$(echo "$affected" | jq -r '.packages[]')"
          if [ "$(echo "$affected" | jq -r '.allStorefronts')" = "true" ]; then
            targets="$targets
          $(ls -d storefronts/*/ storefronts/_examples/*/ 2>/dev/null)"
          fi
          for dir in $targets; do
            dir="${dir%/}"
            [ -f "$dir/package.json" ] || continue
            if jq -e '.scripts.build' "$dir/package.json" > /dev/null 2>&1; then
              echo "build $dir"
              (cd "$dir" && bun run build)
            fi
          done
          # Deliberately not wired: the Playwright e2e suite needs docker +
          # chromium on the runner; `vendua qa` covers it locally for now.
