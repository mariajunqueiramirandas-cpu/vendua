name: ci

on:
  push:
    branches: [main]
  pull_request:
    # label events must rerun the pipeline — a storefront: label changes what storefront-isolation enforces on the same head
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # format self-dispatches after its autofix push — workflow_dispatch is the GITHUB_TOKEN exception that re-runs checks on the fixed head
  workflow_dispatch:
    inputs:
      # PR base forwarded by the format job; empty = main-push autofix, so Builds builds every storefront
      base_ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # prettier autofix commits back to the branch; same-repo branches only (can't checkout/push fork heads) — the sole write-token job
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # self-dispatches ci after pushing the autofix commit
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.fork == false &&
        !contains(fromJSON('["labeled","unlabeled"]'), github.event.action))
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write . --log-level warn
      - name: Commit formatting fix
        id: autofix
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            # no [skip ci]: GITHUB_TOKEN pushes can't retrigger synchronize anyway — the dispatch below does that
            git commit -m 'style: prettier auto-fix'
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Retrigger checks on the fixed head
        if: steps.autofix.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # refs reach the shell as env, never spliced into the script (branch names are attacker-chosen)
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        # workflow_dispatch runs on the branch ref, so checks attach to the autofix commit and surface on the PR
        run: gh workflow run ci.yml --ref "$HEAD_REF" -f base_ref="$BASE_REF"

  # a `storefront:<slug>` PR may only touch storefronts/<slug>/** (unlabeled = no-op pass) — the only job label events must rerun
  storefront-isolation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the check diffs origin/<base>...HEAD
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun tools/check-storefront-paths.mjs

  # services/ig-sidecar is Go — the Bun jobs never see it
  ig-sidecar:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
    defaults:
      run:
        working-directory: services/ig-sidecar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/ig-sidecar/go.mod
          cache-dependency-path: services/ig-sidecar/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  # services/stt is Python — the Bun jobs never see it
  stt:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
    defaults:
      run:
        working-directory: services/stt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/stt/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -t . -v

  # validates the merge ref (PR) / pushed commit (main) — the code that lands
  check:
    runs-on: ubuntu-latest
    # label events matter only to storefront-isolation; check/format run the same unchanged head
    if: >-
      github.event_name == 'push' ||
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # tools/affected.mjs diffs origin/<base>...HEAD on PRs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Typecheck
        # every workspace dir with a `check` script — new packages need zero CI edits (tools/workspaces.mjs, also `bun run check`)
        run: bun tools/workspaces.mjs check
      - name: Isolation tools tests
        run: bun test tools/
      - name: Agent runtime boundary (ADR 0030)
        run: bun tools/check-agent-runtime-boundary.mjs
      - name: Builds
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          INPUT_BASE_REF: ${{ github.event.inputs.base_ref }}
        run: |
          # PRs build the affected graph (tools/affected.mjs) against the base; a main push builds every storefront
          if [ "$EVENT_NAME" = "pull_request" ]; then
            affected="$(bun tools/affected.mjs --base "origin/$BASE_REF")"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_BASE_REF" ]; then
            # autofix retrigger: base arrives via the input, not github.base_ref — same affected scoping as the PR run
            affected="$(bun tools/affected.mjs --base "origin/$INPUT_BASE_REF")"
          else
            affected='{"packages":["site"],"allStorefronts":true}'
          fi
          echo "$affected"
          targets="$(echo "$affected" | jq -r '.packages[]')"
          if [ "$(echo "$affected" | jq -r '.allStorefronts')" = "true" ]; then
            targets="$targets
          $(ls -d storefronts/*/ 2>/dev/null)"
          fi
          for dir in $targets; do
            dir="${dir%/}"
            [ -f "$dir/package.json" ] || continue
            if jq -e '.scripts.build' "$dir/package.json" > /dev/null 2>&1; then
              echo "build $dir"
              (cd "$dir" && bun run build)
              # storefront artifacts must be a valid compat-matrix row (K16)
              if [ -f "$dir/vendua.config.ts" ]; then bunx vendua-conformance manifest "$dir"; fi
            fi
          done
      - name: Unit tests (conformance, the status page + any package with a test script but core)
        # packages/core is the core-tests job's; the same script serves `bun run test` locally
        run: bun tools/workspaces.mjs test

  # Postgres-backed core tests, split from `check` so the two run in parallel
  core-tests:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Scope diffs origin/<base>...HEAD
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      # PR / autofix-retrigger runs skip this job when the diff can't affect it (tools/affected.mjs); main pushes run it all
      - name: Scope
        id: scope
        env:
          BASE_REF: ${{ github.base_ref || github.event.inputs.base_ref }}
        run: |
          base="$BASE_REF"
          if [ -z "$base" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            affected="$(bun tools/affected.mjs --base "origin/$base")" # a failed diff fails the step, never a silent skip
            echo "run=$(echo "$affected" | jq -r '.coreTests')" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile
      # Postgres so TEST_DATABASE_URL tests actually run instead of skipping
      - name: Postgres
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/postgres
      # the suite only accepts a database named *_test (test/hermetic.ts), so it never shares one with a dev Core
      - name: Test database
        if: steps.scope.outputs.run == 'true'
        run: PGPASSWORD=vendua /usr/lib/postgresql/16/bin/createdb -h localhost -p 5433 -U vendua vendua_test
      - name: Core tests
        if: steps.scope.outputs.run == 'true'
        run: cd packages/core && TEST_DATABASE_URL=postgres://vendua:vendua@localhost:5433/vendua_test bun test

  # exit criterion: scaffold a fresh storefront, boot Postgres + Core, run the conformance e2e through the preview proxy
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'push' ||
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Scope diffs origin/<base>...HEAD
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      # PR / autofix-retrigger runs skip this job when the diff can't affect it (tools/affected.mjs); main pushes run it all
      - name: Scope
        id: scope
        env:
          BASE_REF: ${{ github.base_ref || github.event.inputs.base_ref }}
        run: |
          base="$BASE_REF"
          if [ -z "$base" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "smoke=true" >> "$GITHUB_OUTPUT"
            # main pushes judge the stores the pushed commit touched (all of them when shared code changed)
            affected="$(bun tools/affected.mjs --base HEAD~1)"
            echo "storefronts=$(echo "$affected" | jq -r '.storefronts | join(" ")')" >> "$GITHUB_OUTPUT"
          else
            affected="$(bun tools/affected.mjs --base "origin/$base")" # a failed diff fails the step, never a silent skip
            echo "run=$(echo "$affected" | jq -r '.conformance')" >> "$GITHUB_OUTPUT"
            echo "smoke=$(echo "$affected" | jq -r '.smoke')" >> "$GITHUB_OUTPUT"
            echo "storefronts=$(echo "$affected" | jq -r '.storefronts | join(" ")')" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: Postgres
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/postgres
      - name: Migrate
        if: steps.scope.outputs.run == 'true'
        run: cd packages/core && bun run migrate
      - name: Core API
        if: steps.scope.outputs.run == 'true'
        run: |
          (cd packages/core && SESSION_SECRET=ci-secret bun run dev > /tmp/core.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/healthz && break
            sleep 1
          done
      - name: Playwright browser
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/playwright-chromium
      - name: Scaffold + check + qa (exit criterion)
        if: steps.scope.outputs.run == 'true' && steps.scope.outputs.smoke == 'true'
        run: |
          bunx vendua scaffold ci-smoke
          bun install
          bunx vendua check ci-smoke
          bunx vendua qa ci-smoke
      # the storefronts this diff touches (every one on main pushes): static K-rules, K05 (the PR
      # touches only its own storefront dir) and the conformance e2e; every slug runs before the step fails
      - name: Affected storefronts (check + K05 + qa)
        if: steps.scope.outputs.run == 'true' && steps.scope.outputs.storefronts != ''
        env:
          STOREFRONTS: ${{ steps.scope.outputs.storefronts }}
          BASE_REF: ${{ github.base_ref || github.event.inputs.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          failed=""
          for slug in $STOREFRONTS; do
            echo "::group::$slug"
            ok=1
            bunx vendua check "$slug" || ok=0
            # K05 judges a store's own PR (labelled storefront:<slug>); a platform PR touches more by design.
            # After a prettier autofix the only run on the head is the dispatch one: site branches keep K05 there
            if { [ "$EVENT_NAME" = "pull_request" ] && [[ " $PR_LABELS " == *" storefront:$slug "* ]]; } ||
              { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$BASE_REF" ] && [[ "$REF_NAME" == claude/site-* ]]; }; then
              bunx vendua-conformance k05 "$slug" "origin/$BASE_REF" || ok=0
            fi
            bunx vendua qa "$slug" || ok=0
            echo "::endgroup::"
            if [ "$ok" = 1 ]; then echo "PASS $slug"; else echo "FAIL $slug"; failed="$failed $slug"; fi
          done
          if [ -n "$failed" ]; then
            echo "::error::storefront conformance failed:$failed"
            exit 1
          fi
      - name: Upload qa-report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-report
          path: storefronts/*/qa-report
          retention-days: 7
          if-no-files-found: ignore

  # Control Plane smoke (Phase 4): a staff invite provisions a store, the `_template` build is
  # published as a release, a real edge serves it with vendua-state, Core's probes verify it
  # through the edge, a new release rolls out and a rollback brings the old one back.
  edge-smoke:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Scope diffs origin/<base>...HEAD
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Scope
        id: scope
        env:
          BASE_REF: ${{ github.base_ref || github.event.inputs.base_ref }}
        run: |
          base="$BASE_REF"
          if [ -z "$base" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            affected="$(bun tools/affected.mjs --base "origin/$base")"
            echo "run=$(echo "$affected" | jq -r '.edgeSmoke')" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: Postgres
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/postgres
      - name: Migrate
        if: steps.scope.outputs.run == 'true'
        run: cd packages/core && bun run migrate
      - name: Build the template storefront
        if: steps.scope.outputs.run == 'true'
        run: cd storefronts/_template && bun run build
      - name: Core API (probes through the edge)
        if: steps.scope.outputs.run == 'true'
        run: |
          (cd packages/core && SESSION_SECRET=ci-secret CONTROL_SECRET=ci-control \
            VENDUA_EDGE_SECRET=ci-edge VENDUA_PROBES=1 VENDUA_PROBE_ORIGIN=http://localhost:8080 \
            bun src/index.ts > /tmp/core.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/healthz && break
            sleep 1
          done
      - name: Smoke
        if: steps.scope.outputs.run == 'true'
        env:
          CONTROL_SECRET: ci-control
          VENDUA_EDGE_SECRET: ci-edge
        run: bun packages/edge/scripts/smoke.ts
      - name: Core log
        if: failure() && steps.scope.outputs.run == 'true'
        run: tail -200 /tmp/core.log

  # merchant admin quality gate (docs/merchant-admin.md): every screen at 375/820/1440 in
  # Creme and Noite against a seeded store — no horizontal overflow, no console errors,
  # zero serious/critical axe violations. The bundle budget runs inside `bun run build`.
  # The screenshots took ~290 s of one job, so each theme × size is its own runner (scripts/shots.ts
  # THEMES / SIZES): together they cover exactly what the single run did. The `admin-gate` job
  # below only reports their verdict under the old check name.
  admin-shots:
    name: admin-gate shots (${{ matrix.theme }}, ${{ matrix.size }})
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
    strategy:
      # every shard reports its own findings instead of the first failure cancelling the rest
      fail-fast: false
      matrix:
        theme: [creme, noite]
        size: [phone, tablet, desktop]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Scope diffs origin/<base>...HEAD
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Scope
        id: scope
        env:
          BASE_REF: ${{ github.base_ref || github.event.inputs.base_ref }}
        run: |
          base="$BASE_REF"
          if [ -z "$base" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            affected="$(bun tools/affected.mjs --base "origin/$base")"
            echo "run=$(echo "$affected" | jq -r '.adminGate')" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: Build the admin
        if: steps.scope.outputs.run == 'true'
        run: cd apps/admin && bun run build
      - name: Postgres
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/postgres
      - name: Migrate + seed
        if: steps.scope.outputs.run == 'true'
        run: cd packages/core && bun run migrate && bun run seed:fixtures
      - name: Core API (serves apps/admin/dist at /admin/)
        if: steps.scope.outputs.run == 'true'
        run: |
          (cd packages/core && SESSION_SECRET=ci-secret VENDUA_ADMIN_DEV_OTP=1 bun src/index.ts > /tmp/core.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/healthz && break
            sleep 1
          done
      - name: Demo orders
        if: steps.scope.outputs.run == 'true'
        run: cd apps/admin && bun scripts/demo-orders.ts 40
      - name: Playwright browser
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/playwright-chromium
      - name: Screenshots + overflow + axe
        if: steps.scope.outputs.run == 'true'
        env:
          THEMES: ${{ matrix.theme }}
          SIZES: ${{ matrix.size }}
        run: cd apps/admin && BASE=http://localhost:8787/admin/ AXE=1 bun scripts/shots.ts
      - name: Upload screenshots
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-screenshots-${{ matrix.theme }}-${{ matrix.size }}
          path: apps/admin/shots
          retention-days: 7
      - name: Core log on failure
        if: failure() && steps.scope.outputs.run == 'true'
        run: tail -200 /tmp/core.log

  # one required-check name for the shards above: green only when every shard is, and when the
  # shards were skipped (label events) so is this
  admin-gate:
    needs: admin-shots
    runs-on: ubuntu-latest
    if: >-
      !cancelled() && (github.event_name == 'push' ||
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action))
    steps:
      - name: Every admin-gate shard passed
        env:
          RESULT: ${{ needs.admin-shots.result }}
        run: |
          echo "admin-shots: $RESULT"
          [ "$RESULT" = success ]

  # the staleness guarantee (11): a storefront built on the oldest supported Kernel
  # line, never rebuilt, keeps passing the S-series against Core main
  stale-reference:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Scope diffs origin/<base>...HEAD
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      # same scoping as conformance: PRs that can't affect Core/Kernel/storefronts skip it
      - name: Scope
        id: scope
        env:
          BASE_REF: ${{ github.base_ref || github.event.inputs.base_ref }}
        run: |
          base="$BASE_REF"
          if [ -z "$base" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            affected="$(bun tools/affected.mjs --base "origin/$base")"
            echo "run=$(echo "$affected" | jq -r '.conformance')" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: Postgres
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/postgres
      - name: Migrate
        if: steps.scope.outputs.run == 'true'
        run: cd packages/core && bun run migrate
      - name: Core API
        if: steps.scope.outputs.run == 'true'
        run: |
          (cd packages/core && SESSION_SECRET=ci-secret bun run dev > /tmp/core.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/healthz && break
            sleep 1
          done
      - name: Playwright browser
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/playwright-chromium
      - name: S-series on the Kernel 1.0.0 artifact
        if: steps.scope.outputs.run == 'true'
        run: bunx vendua-conformance e2e packages/conformance/stale/kernel-1.0.0 --prebuilt --grep '\[(S0|K16)'

  # fleet operations over every in-repo storefront: a train pulling design data
  # from Core (zero storefront diffs), a template-migration dry run, and the
  # Contract-major codemod rehearsal (failure tail measured)
  fleet:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
    env:
      CONTROL_SECRET: ci-control
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Scope diffs origin/<base>...HEAD
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      # same scoping as conformance: PRs that can't affect Core/Kernel/storefronts skip it
      - name: Scope
        id: scope
        env:
          BASE_REF: ${{ github.base_ref || github.event.inputs.base_ref }}
        run: |
          base="$BASE_REF"
          if [ -z "$base" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            affected="$(bun tools/affected.mjs --base "origin/$base")"
            echo "run=$(echo "$affected" | jq -r '.conformance')" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: Postgres
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/postgres
      - name: Migrate + seed
        if: steps.scope.outputs.run == 'true'
        run: cd packages/core && bun run migrate && bun run seed:fixtures
      - name: Core API
        if: steps.scope.outputs.run == 'true'
        run: |
          (cd packages/core && SESSION_SECRET=ci-secret CONTROL_SECRET=ci-control bun run dev > /tmp/core.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/healthz && break
            sleep 1
          done
      - name: Train (build + check + compat + record, pulling from Core)
        if: steps.scope.outputs.run == 'true'
        run: bunx vendua train --core --record
      - name: Template migrations — dry run over the fleet
        if: steps.scope.outputs.run == 'true'
        run: |
          for id in $(bunx vendua templates list | cut -d' ' -f1); do
            bunx vendua templates migrate "$id"
          done
      - name: Codemod rehearsal
        if: steps.scope.outputs.run == 'true'
        run: bunx vendua codemod rehearse c3-rehearsal
