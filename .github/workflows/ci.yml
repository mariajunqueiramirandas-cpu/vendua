name: ci

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled rerun the pipeline so storefront-isolation can't go
    # stale — adding/removing a storefront: label changes what the check
    # enforces on the same head commit.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The format job self-dispatches after pushing an autofix commit:
  # GITHUB_TOKEN pushes can't trigger synchronize, but workflow_dispatch IS
  # in the exception — the dispatched run's checks attach to the fixed head.
  workflow_dispatch:
    inputs:
      # The PR's base, forwarded by the format job — github.base_ref doesn't
      # exist under workflow_dispatch and without it the Builds step would
      # rebuild the whole storefront fleet on every autofix. Empty means a
      # main-push autofix: there is no stable base behind the new commit, so
      # Builds keeps the push semantics of building every storefront.
      base_ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Runs prettier --write and commits style-only diffs back to the branch, so
  # formatting can never be the reason a change is blocked. Same-repo branches
  # only: a fork's head_ref doesn't exist in this repo (checkout would fail)
  # and the token can't push to forks anyway. This job is the only holder of
  # a write token; validation stays read-only.
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # self-dispatches ci after pushing the autofix commit
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.fork == false &&
        !contains(fromJSON('["labeled","unlabeled"]'), github.event.action))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write . --log-level warn
      - name: Commit formatting fix
        id: autofix
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            # No [skip ci] — but GITHUB_TOKEN pushes can't trigger
            # synchronize regardless; the dispatch below is what actually
            # re-runs checks on the fixed head.
            git commit -m 'style: prettier auto-fix'
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Retrigger checks on the fixed head
        if: steps.autofix.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # workflow_dispatch is the documented GITHUB_TOKEN exception — its
        # run executes on the branch ref, so checks attach to the autofix
        # commit and surface on the PR. check/conformance pass their `if`
        # under workflow_dispatch; format skips (tree is already clean) and
        # storefront-isolation skips (the autofix never changes the path
        # set — the earlier synchronize already vetted boundaries).
        run: gh workflow run ci.yml --ref "${{ github.head_ref || github.ref_name }}" -f base_ref="${{ github.base_ref }}"

  # Storefront write-scope boundary (docs/architecture/06-monorepo.md): a PR
  # labelled `storefront:<slug>` may only touch `storefronts/<slug>/**`. No
  # `storefront:` label → no-op pass, so platform PRs don't need labels.
  # The only job gated on label events: labeled/unlabeled MUST rerun it (the
  # whole point of the trigger above); check/format skip those events since
  # the head commit is unchanged.
  storefront-isolation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the check diffs origin/<base>...HEAD
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun tools/check-storefront-paths.mjs

  # Validates GitHub's merge ref (PR) / the pushed commit (main) — the code
  # that will actually land.
  check:
    runs-on: ubuntu-latest
    # Label events only matter to storefront-isolation — check/format run the
    # same unchanged head commit.
    if: >-
      github.event_name == 'push' ||
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tools/affected.mjs diffs origin/<base>...HEAD on PRs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: |
          # Every workspace dir with a `check` script — a new package or
          # storefront needs zero CI edits.
          for dir in packages/* site apps/* storefronts/* storefronts/_examples/*; do
            [ -d "$dir" ] || continue
            [ -f "$dir/package.json" ] || continue
            if jq -e '.scripts.check' "$dir/package.json" > /dev/null; then
              echo "check $dir"
              (cd "$dir" && bun run check)
            fi
          done
      # DB-backed tests opt in via TEST_DATABASE_URL — without Postgres they
      # skip silently. Boot the same compose Postgres the conformance job
      # uses so they actually run in CI.
      - name: Postgres for core tests
        run: |
          docker compose -f packages/core/docker-compose.yml up -d postgres
          for i in $(seq 1 30); do
            docker compose -f packages/core/docker-compose.yml exec -T postgres pg_isready -h localhost -p 5432 -U vendua && break
            sleep 1
          done
          # Assert readiness — a broken container must fail HERE, not as an
          # indirect connection error inside the test step.
          docker compose -f packages/core/docker-compose.yml exec -T postgres pg_isready -h localhost -p 5432 -U vendua
      - name: Core tests
        run: cd packages/core && TEST_DATABASE_URL=postgres://vendua:vendua@localhost:5433/vendua bun test
      - name: Isolation tools tests
        run: bun test tools/
      - name: Builds
        run: |
          # Storefront builds follow the affected graph (tools/affected.mjs)
          # against the PR base; a push to main builds every storefront.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            affected="$(bun tools/affected.mjs --base "origin/${{ github.base_ref }}")"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.base_ref }}" ]; then
            # PR autofix retrigger: the base comes through the input, not
            # github.base_ref — keep the same affected scoping as the PR run.
            affected="$(bun tools/affected.mjs --base "origin/${{ github.event.inputs.base_ref }}")"
          else
            affected='{"packages":["site"],"allStorefronts":true}'
          fi
          echo "$affected"
          targets="$(echo "$affected" | jq -r '.packages[]')"
          if [ "$(echo "$affected" | jq -r '.allStorefronts')" = "true" ]; then
            targets="$targets
          $(ls -d storefronts/*/ storefronts/_examples/*/ 2>/dev/null)"
          fi
          for dir in $targets; do
            dir="${dir%/}"
            [ -f "$dir/package.json" ] || continue
            if jq -e '.scripts.build' "$dir/package.json" > /dev/null 2>&1; then
              echo "build $dir"
              (cd "$dir" && bun run build)
            fi
          done
      - name: Unit tests (conformance + any workspace with a test script)
        run: |
          for dir in packages/* tools; do
            [ -d "$dir" ] || continue
            [ -f "$dir/package.json" ] || continue
            if jq -e '.scripts.test' "$dir/package.json" > /dev/null 2>&1; then
              echo "test $dir"
              (cd "$dir" && bun test)
            fi
          done

  # The phase's exit criterion enforced in CI: scaffold a fresh storefront,
  # boot real Postgres + Core, and run the full conformance e2e (C/S/Q
  # Playwright suite) against it — the preview proxy forwards Host exactly
  # like the production edge.
  conformance:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Postgres + migrate
        run: |
          docker compose -f packages/core/docker-compose.yml up -d postgres
          # pg_isready on the unix socket is answered by the image's temporary
          # init server too — check TCP, which only the real server listens on.
          for i in $(seq 1 30); do
            docker compose -f packages/core/docker-compose.yml exec -T postgres pg_isready -h localhost -p 5432 -U vendua && break
            sleep 1
          done
          (cd packages/core && bun run migrate)
      - name: Core API
        run: |
          (cd packages/core && SESSION_SECRET=ci-secret bun run dev > /tmp/core.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/healthz && break
            sleep 1
          done
      - name: Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Scaffold + qa (exit criterion)
        run: |
          bunx vendua scaffold ci-smoke
          bun install
          bunx vendua qa ci-smoke
