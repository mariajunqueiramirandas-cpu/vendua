      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          const DUR = 11.25;
          const B = 0.46875;
          const T0 = 41.25;
          const L = (track) => track - T0;
          const $ = (s) => document.querySelector(s);
          const PX = 200; // reel row height = price font-size

          // reels: k full 0–9 loops, then 0–9 again so the overshoot shows the next digit
          document.querySelectorAll("#stage .f8-reel").forEach((r) => {
            const k = +r.dataset.k;
            let h = "";
            for (let i = 0; i < 10 * (k + 1); i++) h += "<b>" + (i % 10) + "</b>";
            r.innerHTML = h;
          });

          const tl = gsap.timeline({ paused: true });

          // ── base state ──
          tl.set("#f8-cam", { y: 0, skewY: 0, filter: "blur(0px)" }, 0);
          tl.set("#f8-punch", { scale: 1, transformOrigin: "50% 45%" }, 0);
          tl.set("#f8-shake", { x: 0, y: 0, rotation: 0 }, 0);
          tl.set("#f8-bgl", { autoAlpha: 1 }, 0);
          tl.set("#f8-g1", { autoAlpha: 1 }, 0);
          tl.set("#f8-mkbg", { scaleX: 0 }, 0);
          tl.set(".f8-reel", { y: 0 }, 0);

          const slam = (sel, at, from, dur) => {
            tl.fromTo(
              sel,
              Object.assign({ scale: 1.18, filter: "blur(14px)", opacity: 0 }, from || {}),
              { scale: 1, filter: "blur(0px)", opacity: 1, duration: dur || 0.16, ease: "power4.out" },
              Math.max(0, at - 0.06),
            );
          };
          const shake = (at, amp) => {
            const SH = [[8, -6, 0.6], [-7, 5, -0.5], [6, 7, 0.4], [-8, -4, -0.6], [5, 4, 0.3], [-4, -5, -0.3], [3, 2, 0.2], [-2, -2, -0.1]];
            SH.forEach((s, i) => tl.to("#f8-shake", { x: s[0] * amp, y: s[1] * amp, rotation: s[2] * amp, duration: 0.03, ease: "steps(1)" }, at + i * 0.03));
            tl.to("#f8-shake", { x: 0, y: 0, rotation: 0, duration: 0.05, ease: "power2.out" }, at + SH.length * 0.03);
          };
          const punchIn = (at, s) => {
            tl.to("#f8-punch", { scale: s || 1.06, duration: B, ease: "power2.out" }, at);
            tl.to("#f8-punch", { scale: 1, duration: 1.875 - B, ease: "sine.inOut" }, at + B);
          };
          // slot roll: every reel spins from row 0 and settles on its digit, right-most last on `lock`
          const roll = (prefix, n, from, lock) => {
            for (let i = 0; i < n; i++) {
              const r = $("#" + prefix + i);
              const idx = 10 * +r.dataset.k + +r.dataset.d;
              const end = lock - (n - 1 - i) * 0.055;
              tl.fromTo(r, { y: 0 }, { y: -idx * PX, duration: end - from, ease: "back.out(0.9)" }, from);
              tl.fromTo(r, { filter: "blur(0px)" }, { keyframes: [{ filter: "blur(5px)", duration: 0.12, ease: "none" }, { filter: "blur(0px)", duration: end - from - 0.12, ease: "power3.in" }] }, from);
            }
          };
          const perks = (sel, times) => {
            const els = document.querySelectorAll(sel);
            times.forEach((tt, i) => {
              const at = L(tt);
              tl.fromTo(els[i], { opacity: 0, x: -46, scale: 1.08, filter: "blur(12px)" }, { opacity: 1, x: 0, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, at - 0.07);
              tl.fromTo(els[i].querySelector(".f8-ic"), { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.26, ease: "back.out(3)" }, at - 0.05);
            });
          };

          // ═════ g1 — DROP on lime, then Mirim (local 0 → 3.75) ═════
          const NIGHT = L(41.484375);
          // the card is already whipping up on the lime frame at t=0
          tl.fromTo("#f8-c1", { y: 640, skewY: 7, filter: "blur(14px)", scale: 1.06 }, { y: 0, skewY: 0, filter: "blur(0px)", scale: 1, duration: 0.34, ease: "expo.out" }, 0);
          shake(0, 1);
          tl.set("#f8-bgl", { autoAlpha: 0 }, NIGHT);
          slam("#f8-h1", NIGHT);
          slam("#f8-n1", NIGHT, { scale: 1.12 });
          // slow breathing of the whole Mirim block
          tl.fromTo("#f8-c1", { scale: 1 }, { y: -16, scale: 1.02, duration: L(44.53125) - 0.34, ease: "sine.inOut", immediateRender: false }, 0.34);
          tl.fromTo("#f8-h1", { x: 0 }, { x: 18, duration: L(44.53125) - NIGHT, ease: "none" }, NIGHT);

          const LOCK1 = L(42.1875);
          roll("f8-r1-", 4, NIGHT + 0.04, LOCK1);
          tl.fromTo("#f8-p1", { scale: 1 }, { keyframes: [{ scale: 1.1, duration: 0.06, ease: "power2.out" }, { scale: 1, duration: 0.3, ease: "power3.out" }] }, LOCK1);
          perks(".f8-pk1", [42.65625, 43.125, 43.59375]);
          punchIn(L(43.125), 1.04);

          // Mirim whips out left
          const OUT1 = L(44.53125);
          tl.to("#f8-c1", { x: -1250, skewX: 10, filter: "blur(14px)", duration: 0.26, ease: "expo.in" }, OUT1);
          tl.to("#f8-h1", { x: -1150, skewX: 10, filter: "blur(14px)", duration: 0.22, ease: "expo.in" }, OUT1 + 0.03);

          // ═════ g2 — Bandeira (local 3.75 → 7.5) ═════
          const S2 = L(45.0);
          tl.set("#f8-g2", { autoAlpha: 1 }, S2 - 0.26);
          tl.set("#f8-g1", { autoAlpha: 0 }, S2);
          tl.fromTo("#f8-glow", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: "power2.out" }, S2 - 0.1);
          tl.fromTo("#f8-c2", { x: 1250, skewX: -10, filter: "blur(14px)" }, { x: 0, skewX: 0, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, S2 - 0.26);
          slam("#f8-h2a", S2);
          slam("#f8-n2", S2 + 0.04, { scale: 1.12 });
          tl.fromTo("#f8-pill", { scale: 0, rotation: -8, opacity: 1 }, { scale: 1, rotation: -3, opacity: 1, duration: 0.3, ease: "back.out(3.2)" }, S2);
          punchIn(S2, 1.05);
          tl.fromTo("#f8-h2a", { x: 0 }, { x: 16, duration: L(48.75) - S2, ease: "none", immediateRender: false }, S2 + 0.12);

          const LOCK2 = L(45.9375);
          roll("f8-r2-", 3, S2 + 0.06, LOCK2);
          tl.fromTo("#f8-p2", { scale: 1 }, { keyframes: [{ scale: 1.14, duration: 0.06, ease: "power2.out" }, { scale: 1, duration: 0.34, ease: "power3.out" }] }, LOCK2);
          shake(LOCK2, 0.9);
          perks(".f8-pk2", [46.40625, 46.875, 47.34375, 47.8125, 48.28125]);

          // Duá pops on the card's corner
          const DUA = L(46.875);
          tl.fromTo("#f8-dua", { scale: 0, rotation: 30, opacity: 1 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.34, ease: "back.out(2.4)" }, DUA - 0.06);
          tl.to("#f8-dua", { y: 8, rotation: 4, duration: L(50.625) - DUA - 0.3, ease: "sine.inOut" }, DUA + 0.3);
          punchIn(DUA, 1.03);

          // ═════ g3 — hold, light sweep, headline swap (local 7.5 → 9.375) ═════
          const S3 = L(48.75);
          const S3B = L(49.6875);
