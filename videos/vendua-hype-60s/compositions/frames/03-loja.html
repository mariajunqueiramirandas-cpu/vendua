      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          const D = 7.5;
          const B = 0.46875; // beat
          const E = B / 2; // eighth
          const S2 = 1.875,
            S3 = 3.75,
            S4 = 5.625;
          const q = (s) => document.getElementById(s.slice(1));
          const tl = gsap.timeline({ paused: true });

          // slam: scale 1.18→1, blur 14→0, opacity 0→1 in .16 s, landing on `at`
          const slam = (sel, at, lead = 0.06) => {
            tl.set(sel, { visibility: "inherit" }, at - lead);
            tl.fromTo(
              sel,
              { opacity: 0, scale: 1.18, filter: "blur(14px)" },
              {
                opacity: 1,
                scale: 1,
                filter: "blur(0px)",
                duration: 0.16,
                ease: "power4.out",
                immediateRender: false,
              },
              at - lead,
            );
          };
          const markWipe = (bg, txt, at) => {
            tl.fromTo(
              bg,
              { scaleX: 0 },
              { scaleX: 1, duration: 0.18, ease: "power3.out", immediateRender: false },
              at,
            );
            tl.set(txt, { color: "#123c32" }, at + 0.07);
          };
          const camPunch = (at, peak, back) => {
            tl.to("#f3-cam", { scale: peak, duration: 0.18, ease: "power3.out" }, at - 0.02);
            tl.to("#f3-cam", { scale: 1, duration: back, ease: "power2.inOut" }, at + 0.16);
          };

          // ---------- initial states ----------
          tl.set("#f3-h1", { display: "block" }, 0);
          tl.set("#f3-cam", { scale: 1, y: 0, filter: "blur(0px)", skewY: 0 }, 0);

          // ---------- S1 · 0 – 1.875: phone whips up, "8 perguntinhas." ----------
          tl.fromTo(
            "#f3-move",
            { y: 420, scale: 1 },
            { y: 0, duration: 0.3, ease: "expo.out" },
            0,
          );
          tl.fromTo(
            "#f3-phone",
            { filter: "blur(9px)", skewY: 5 },
            { filter: "blur(0px)", skewY: 0, duration: 0.24, ease: "expo.out" },
            0,
          );
          tl.fromTo(
            "#f3-move",
            { y: 0 },
            { y: -26, duration: S2 - 0.3, ease: "sine.inOut", immediateRender: false },
            0.3,
          );
          tl.fromTo(
            "#f3-tilt",
            { rotationY: -14, rotationX: 9 },
            { rotationY: -4, rotationX: 4, duration: S2, ease: "power2.out" },
            0,
          );
          // line 1 already mid-slam on the cut
          tl.set("#f3-h1a", { visibility: "inherit" }, 0);
          tl.fromTo(
            "#f3-h1a",
            { opacity: 0.8, scale: 1.08, filter: "blur(5px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "power4.out" },
            0,
          );
          slam("#f3-h1b", 2 * B);
          slam("#f3-h1c", 2 * B + E);
          camPunch(2 * B, 1.05, 0.8);
          // breathing: the headline creeps
          tl.fromTo(
            "#f3-h1",
            { x: 0 },
            { x: -14, duration: S2, ease: "none", immediateRender: false },
            0,
          );

          // ---------- wipe S1 → S2 ----------
          tl.fromTo(
            "#f3-wipe",
            { x: -2400, skewX: -12 },
            { x: 1500, skewX: -12, duration: 0.26, ease: "none", immediateRender: false },
            S2 - 0.13,
          );
          tl.set("#f3-h1", { display: "none" }, S2);
          tl.set("#f3-h2", { display: "block" }, S2);
          tl.set("#f3-scr-boas", { visibility: "hidden" }, S2);
          tl.set("#f3-store", { display: "block" }, S2);

          // ---------- S2 · 1.875 – 3.75: drawn storefront ----------
          slam("#f3-h2a", S2, 0.0);
          slam("#f3-h2b", S2 + B);
          markWipe("#f3-m2bg", "#f3-m2", S2 + B + 0.1);
          tl.fromTo(
            "#f3-h2",
            { x: 0 },
            { x: -14, duration: S3 - S2, ease: "none", immediateRender: false },
            S2,
          );

          // url types on 1.875 → 2.34
          const chars = gsap.utils.toArray(q("#f3-url").querySelectorAll("span"));
          const step = (B - 0.03) / chars.length;
          chars.forEach((c, i) => tl.set(c, { display: "inline" }, S2 + 0.02 + i * step));
          // caret blinks a fixed number of times, then hides
          for (let k = 0; k < 6; k++) {
            tl.set("#f3-caret", { opacity: k % 2 ? 1 : 0 }, S2 + B + 0.05 + k * 0.16);
          }

          // store header + cover fill (directional fill left→right)
          tl.fromTo(
            "#f3-shead",
            { opacity: 0, y: -16 },
            { opacity: 1, y: 0, duration: 0.2, ease: "expo.out", immediateRender: false },
            S2 + 0.04,
          );
          tl.set("#f3-shead", { opacity: 0 }, 0);
          tl.set("#f3-cover-fill", { scaleX: 0 }, 0);
          tl.to("#f3-cover-fill", { scaleX: 1, duration: 0.26, ease: "power3.out" }, S2 + 0.06);
          tl.set("#f3-cover-in", { opacity: 0 }, 0);
          tl.fromTo(
            "#f3-cover-in",
            { opacity: 0, x: -30, filter: "blur(8px)" },
            {
              opacity: 1,
              x: 0,
              filter: "blur(0px)",
              duration: 0.22,
              ease: "expo.out",
              immediateRender: false,
            },
            S2 + 0.18,
          );
          tl.set("#f3-cats", { opacity: 0 }, 0);
          tl.fromTo(
            "#f3-cats",
            { opacity: 0, x: 60 },
            { opacity: 1, x: 0, duration: 0.24, ease: "expo.out", immediateRender: false },
            S2 + 0.26,
          );

          // product cards drop in on beats
          [1, 2, 3].forEach((n, i) => {
            const at = S2 + B * (i + 1);
            const id = "#f3-card" + n;
            tl.set(id, { visibility: "inherit" }, at - 0.09);
            tl.fromTo(
              id,
              { opacity: 0, y: -110, scale: 1.1, filter: "blur(10px)" },
              {
                opacity: 1,
                y: 0,
                scale: 1,
                filter: "blur(0px)",
                duration: 0.26,
                ease: "expo.out",
                immediateRender: false,
              },
              at - 0.09,
            );
            tl.fromTo(
              id + " .f3-add",
              { scale: 0 },
              { scale: 1, duration: 0.22, ease: "back.out(3)", immediateRender: false },
              at + 0.05,
            );
          });
          // page scrolls so the third card lands in view
          tl.fromTo(
            "#f3-page",
            { y: 0 },
            { y: -80, duration: 0.34, ease: "power3.inOut", immediateRender: false },
            S2 + 3 * B - 0.2,
          );
          // phone drift for the bar
          tl.fromTo(
            "#f3-tilt",
            { rotationY: 9, rotationX: 5 },
            {
              rotationY: 2,
              rotationX: 3,
              duration: S3 - S2 - 0.13,
              ease: "sine.inOut",
              immediateRender: false,
            },
            S2,
          );
          tl.to("#f3-move", { y: -6, duration: S3 - S2, ease: "sine.inOut" }, S2);

          // ---------- S2 → S3: card flip (rotateY) to the Cardápio screen ----------
          tl.to("#f3-flip", { rotationY: 90, duration: 0.13, ease: "power2.in" }, S3 - 0.13);
          tl.set("#f3-store", { display: "none" }, S3);
          tl.set("#f3-scr-card", { visibility: "inherit" }, S3);
          tl.fromTo(
            "#f3-flip",
            { rotationY: -90 },
            { rotationY: 0, duration: 0.3, ease: "expo.out", immediateRender: false },
            S3,
          );
          tl.set("#f3-h2", { display: "none" }, S3);
          tl.set("#f3-h3", { display: "block" }, S3);

          // ---------- S3 · 3.75 – 5.625: word ticker ----------
          const ticks = ["#f3-t1", "#f3-t2", "#f3-t3", "#f3-t4"];
          ticks.forEach((id, i) => {
            const at = S3 + i * B;
            tl.set(id, { visibility: "inherit" }, at);
            if (i > 0) tl.set(ticks[i - 1], { visibility: "hidden" }, at);
            tl.fromTo(
              id,
              { scale: 1.07, filter: "blur(8px)", opacity: 0.4 },
              {
                scale: 1,
                filter: "blur(0px)",
                opacity: 1,
                duration: 0.14,
                ease: "power4.out",
                immediateRender: false,
              },
              at,
            );
          });
          markWipe("#f3-m3bg", "#f3-m3", S3 + 3 * B + 0.03);
          slam("#f3-h3sub", S3 + E);
          tl.fromTo(
            "#f3-scr-card",
            { scale: 1, y: 0 },
            {
              scale: 1.06,
              y: -30,
              duration: S4 - S3,
              ease: "sine.inOut",
              immediateRender: false,
              transformOrigin: "50% 30%",
            },
            S3,
          );
          tl.to(
            "#f3-tilt",
            { rotationY: -6, rotationX: 4, duration: S4 - S3, ease: "sine.inOut" },
            S3 - 0.13,
          );
          camPunch(S3 + 3 * B, 1.04, 0.3);

          // ---------- S3 → S4: crash zoom into Início ----------
          tl.to("#f3-move", { scale: 1.3, y: -30, duration: 0.12, ease: "expo.in" }, S4 - 0.12);
          tl.to("#f3-phone", { filter: "blur(10px)", duration: 0.12, ease: "expo.in" }, S4 - 0.12);
          tl.set("#f3-scr-card", { visibility: "hidden" }, S4);
          tl.set("#f3-scr-ini", { visibility: "inherit" }, S4);
          tl.fromTo(
            "#f3-move",
            { scale: 1.3, y: -30 },
            { scale: 1.1, y: 0, duration: 0.3, ease: "expo.out", immediateRender: false },
            S4,
          );
          tl.fromTo(
            "#f3-phone",
            { filter: "blur(10px)" },
            { filter: "blur(0px)", duration: 0.22, ease: "expo.out", immediateRender: false },
            S4,
          );
          tl.fromTo(
            "#f3-tilt",
            { rotationY: 0, rotationX: 0 },
            {
              rotationY: 4,
              rotationX: 3,
              duration: D - S4,
              ease: "sine.inOut",
              immediateRender: false,
            },
            S4,
          );
          tl.set("#f3-h3", { display: "none" }, S4);
          tl.set("#f3-h4", { display: "block" }, S4);

          // ---------- S4 · 5.625 – 7.5: "Tudo na palma da mão." + sales count ----------
          slam("#f3-h4a", S4, 0.0);
          slam("#f3-h4b", S4 + B);
          tl.fromTo(
            "#f3-h4",
            { x: 0 },
            { x: -12, duration: D - S4, ease: "none", immediateRender: false },
            S4,
          );

          tl.set("#f3-plate", { visibility: "inherit" }, S4 - 0.02);
          tl.fromTo(
            "#f3-plate",
            { opacity: 0, x: 520, skewX: -10, filter: "blur(12px)" },
            {
              opacity: 1,
              x: 0,
              skewX: 0,
              filter: "blur(0px)",
              duration: 0.28,
              ease: "expo.out",
              immediateRender: false,
            },
            S4 - 0.02,
          );
          const LOCK = 14.0625 - 7.5;
          const roll = q("#f3-proll");
          const proxy = { c: 0 };
          const fmt = (c) => {
            const v = Math.round(c);
            return "R$ " + Math.floor(v / 100) + "," + String(v % 100).padStart(2, "0");
          };
          tl.fromTo(
            proxy,
            { c: 0 },
            {
              c: 71800,
              duration: LOCK - (S4 + 0.08),
              ease: "power2.out",
              immediateRender: false,
              onUpdate: () => {
                roll.textContent = fmt(proxy.c);
              },
            },
            S4 + 0.08,
          );
          tl.set("#f3-proll", { visibility: "hidden" }, LOCK);
          tl.set("#f3-pfinal", { visibility: "inherit" }, LOCK);
          tl.fromTo(
            "#f3-plate",
            { scale: 1.08 },
            { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false },
            LOCK,
          );
          camPunch(14.53125 - 7.5, 1.035, 0.25);

          // ---------- exit whip ----------
          const X = 14.85 - 7.5;
          tl.to(
            "#f3-cam",
            {
              y: -1150,
              skewY: -5,
              filter: "blur(14px)",
              duration: D - X,
              ease: "expo.in",
            },
            X,
          );

          tl.set({}, {}, D);
          window.__timelines["03-loja"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
