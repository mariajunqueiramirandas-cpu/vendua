      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });
          const B = 0.46875; // beat
          const S = B / 4; // sixteenth

          // slam: 1.18→1, blur 14→0, 0.16 s power4.out, landing on `at`
          function slam(sel, at, from) {
            tl.fromTo(
              sel,
              { opacity: 0, scale: from || 1.18, filter: "blur(14px)" },
              { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" },
              at - 0.06,
            );
          }
          // shake: deterministic offsets, 0 ms steps
          const SH = [
            [1, -0.6],
            [-0.85, 0.8],
            [0.7, -0.9],
            [-0.75, 0.5],
            [0.55, -0.6],
            [-0.6, 0.35],
            [0.4, -0.4],
            [-0.3, 0.25],
            [0.2, -0.15],
            [-0.1, 0.08],
          ];
          function shake(at, A, R, step) {
            const st = step || 0.025;
            SH.forEach(function (p, i) {
              const k = 1 - i / SH.length;
              tl.set("#f4-shake", { x: p[0] * A, y: p[1] * A, rotation: (i % 2 ? -1 : 1) * R * k }, at + i * st);
            });
            tl.set("#f4-shake", { x: 0, y: 0, rotation: 0 }, at + SH.length * st);
          }
          function punch(at, amt) {
            tl.to("#f4-cam", { scale: amt, duration: 0.09, ease: "power3.out" }, at);
            tl.to("#f4-cam", { scale: 1, duration: 0.6, ease: "power2.inOut" }, at + 0.09);
          }

          // group visibility (0 ms cuts)

          // ── S1 · 0.0–1.875 · lock-screen push ─────────────────────────
          tl.fromTo("#f4-cam", { scale: 1.05 }, { scale: 1, duration: 0.4, ease: "power3.out" }, 0);
          tl.fromTo(
            "#f4-p1",
            { rotationY: -9, rotationX: 5, scale: 1 },
            { rotationY: 5, rotationX: 2, scale: 1.035, duration: 1.7, ease: "sine.inOut" },
            0,
          );
          tl.fromTo(
            "#f4-h1a",
            { opacity: 0.6, scale: 1.08, filter: "blur(5px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "power4.out" },
            0,
          );
          // push drops in from above (overlay-pop)
          tl.fromTo(
            "#f4-push",
            { opacity: 0, y: -170, scale: 0.86, filter: "blur(8px)" },
            { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.34, ease: "back.out(1.7)" },
            0.02,
          );
          // line swap on beat 2
          tl.set("#f4-h1a", { opacity: 0 }, B - 0.06);
          slam("#f4-h1b", B);
          // beat 3: second line + push expands to show "aceitar"
          slam("#f4-h1c", 2 * B);
          tl.to("#f4-actwrap", { height: 80, duration: 0.24, ease: "power3.out" }, 2 * B - 0.04);
          tl.fromTo("#f4-push", { scale: 1.06 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 2 * B);
          punch(2 * B, 1.045);
          // exit whip → S2
          tl.to(
            "#f4-p1wrap",
            { x: -1150, skewX: 12, filter: "blur(12px)", duration: 0.22, ease: "expo.in" },
            1.875 - 0.22,
          );
          tl.to("#f4-h1", { x: -760, filter: "blur(10px)", opacity: 0, duration: 0.2, ease: "expo.in" }, 1.875 - 0.2);
          tl.set("#f4-g1", { autoAlpha: 0 }, 1.875);

          // ── S2 · 1.875–3.75 · real order screen + tap ─────────────────
          const T2 = 1.875;
          tl.set("#f4-g2", { autoAlpha: 1 }, T2 - 0.06);
          tl.fromTo(
            "#f4-p2",
            { x: 1150, skewX: -12, filter: "blur(12px)", scale: 1 },
            { x: 0, skewX: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out" },
            T2 - 0.06,
          );
          tl.to("#f4-p2", { scale: 1.02, duration: 1.6, ease: "sine.inOut" }, T2 + 0.25);
          slam("#f4-h2a", T2);
          slam("#f4-h2b", T2 + B);
          // fingertip glides in and taps "aceitar · 30 min"
          const TAP = T2 + 2 * B; // 2.8125
          tl.fromTo(
            "#f4-finger",
            { opacity: 0, x: 110, y: 130, scale: 1.25 },
            { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.4, ease: "power3.out" },
            TAP - 0.5,
          );
          tl.to("#f4-finger", { scale: 0.8, duration: 0.07, ease: "power2.in" }, TAP - 0.07);
          tl.set("#f4-accept", { opacity: 1 }, TAP);
          tl.fromTo(
            "#f4-accept svg",
            { scale: 0, rotation: -20 },
            { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(3)" },
            TAP,
          );
          tl.fromTo(
            "#f4-ring",
            { opacity: 1, scale: 0.4 },
            { opacity: 0, scale: 2.6, duration: 0.45, ease: "power2.out" },
            TAP,
          );
          tl.to("#f4-finger", { scale: 1, duration: 0.16, ease: "power2.out" }, TAP + 0.03);
          tl.to("#f4-finger", { autoAlpha: 0, duration: 0.15, ease: "power1.out" }, TAP + 0.2);
          punch(TAP, 1.03);

          // ── S3 · 3.75–5.625 · order-state ticker ──────────────────────
          const T3 = 3.75;
          tl.set("#f4-h2", { autoAlpha: 0 }, T3 - 0.06);
          tl.set("#f4-h3", { autoAlpha: 1 }, T3 - 0.06);
          // screen whips up to the orders list; phone settles a little lower
          tl.to("#f4-shotA", { yPercent: -70, filter: "blur(10px)", duration: 0.14, ease: "expo.in" }, T3 - 0.14);
          tl.set("#f4-shotA", { opacity: 0 }, T3);
          tl.set("#f4-shotB", { opacity: 1 }, T3);
          tl.fromTo(
            "#f4-shotB",
            { yPercent: 60, filter: "blur(10px)" },
            { yPercent: 0, filter: "blur(0px)", duration: 0.26, ease: "expo.out" },
            T3,
          );
          tl.to("#f4-p2", { y: 50, duration: 0.3, ease: "expo.out" }, T3);
          tl.to("#f4-shotB", { y: -36, duration: 1.6, ease: "none" }, T3 + 0.26);
          const words = ["#f4-t0", "#f4-t1", "#f4-t2", "#f4-t3"];
          const tabX = [0, 104.35, 209.26, 313.6]; // xPercent steps of 22.54% shot width / 21.6% tab width
          words.forEach(function (w, i) {
            const at = T3 + i * B;
            if (i > 0) tl.set(words[i - 1], { opacity: 0 }, at - 0.06);
            tl.fromTo(
              w,
              { opacity: 0, scale: 1.14, filter: "blur(10px)" },
              { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out" },
              at - 0.06,
            );
            if (i === 0) {
              tl.fromTo("#f4-tab", { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1, duration: 0.18, ease: "power3.out" }, at);
            } else {
              tl.to("#f4-tab", { xPercent: tabX[i], duration: 0.2, ease: "power3.inOut" }, at - 0.1);
              tl.fromTo("#f4-p2", { scale: 1.035 }, { scale: 1, duration: 0.3, ease: "power3.out" }, at);
            }
          });
          tl.to("#f4-mark", { scaleX: 1, duration: 0.18, ease: "power3.out" }, T3 + 3 * B - 0.02);
          tl.fromTo(
            "#f4-sub",
            { autoAlpha: 0, x: -60, filter: "blur(8px)" },
            { autoAlpha: 1, x: 0, filter: "blur(0px)", duration: 0.22, ease: "expo.out" },
            T3 + B / 2,
          );
          // phone flies away, ticker whips up
          const T4 = 5.625;
          tl.to(
