  <style>
    @font-face {
      font-family: 'Space Grotesk Variable';
      font-style: normal;
      font-display: block;
      font-weight: 300 700;
      src: url('assets/fonts/captured-space-grotesk-latin-wght-normal.woff2')

    @font-face {
      font-family: 'Figtree Variable';

      font-display: block;

    #root {
      --canvas: #f7f4ea;
      --ink: #123c32;
      --spark: #d9f875;
      --on-spark: #123c32;
      --night: #0a100d;

      --e1: 0 1px 2px rgb(18 60 50 / 0.06), 0 4px 16px rgb(18 60 50 / 0.05);
      --e3: 0 8px 16px rgb(18 60 50 / 0.1), 0 24px 64px rgb(18 60 50 / 0.16);
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }

    [class~='01-chegou-layer'] {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
    }

    /* cream ground with static paper grain; the night layer above it fades out on the flip */
    [id='01-chegou-cream'] {
      background: var(--canvas);
      container-type: size;
      overflow: hidden;
    }
    [id='01-chegou-grain'] {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      display: block;
    }
    [id='01-chegou-night'] {
      background:
        radial-gradient(circle at 506px 700px, #1a2a21 0%, var(--night-surface) 26%, var(--night) 62%);
    }

    /* ── logo: big stacked state is the CSS layout; the lockup is a transform of it ── */
    [id='01-chegou-logo'] {
      transform-origin: 506px 740px;
    }
    [id='01-chegou-shock'] {
      position: absolute;
      left: 376px;
      top: 510px;
      width: 260px;
      height: 260px;
      box-sizing: border-box;
      border: 4px solid var(--spark);
      border-radius: 50%;
    }
    [id='01-chegou-mark-move'] {
      position: absolute;
      left: 376px;
      top: 510px;
      width: 260px;
      height: 260px;
    }
    [id='01-chegou-mark-inner'] {
      position: absolute;
      inset: 0;
    }
    [class~='01-chegou-mark'] {
      position: absolute;
      inset: 0;
      width: 260px;
      height: 260px;
      overflow: visible;
    }
    [class~='01-chegou-mark'] path {
      fill: none;
      stroke-width: 17;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    [id='01-chegou-mark-night'] path {
      stroke: var(--spark);
    }
    [id='01-chegou-mark-cream'] path {
      stroke: var(--ink);
    }

    [id='01-chegou-word-move'] {
      position: absolute;
      left: 0;
      top: 756px;

      height: 168px;
      text-align: center;
    }
    [id='01-chegou-word-inner'] {
      position: relative;
      display: inline-block;
      font:
        700 168px/1 'Space Grotesk Variable',

      letter-spacing: -0.035em;
      white-space: nowrap;
    }
    [class~='01-chegou-word'] {
      display: block;
    }
    [id='01-chegou-word-night'] {
      color: var(--night-ink);
    }
    [id='01-chegou-word-night'] [class~='01-chegou-dot'] {

    }
    [id='01-chegou-word-cream'] {
      position: absolute;
      left: 0;
      top: 0;
      color: var(--ink);
    }

    /* ── the fan: three mini devices (frame.md device at 250 px) ── */
    [id='01-chegou-fan'] {
      transform-origin: 506px 760px;
    }
    [id='01-chegou-fan-shake'],
    [id='01-chegou-fan-drift'] {
      position: absolute;
      inset: 0;
      transform-origin: 506px 760px;
    }
    [class~='01-chegou-card'] {
      position: absolute;
      width: 250px;
      height: 522.7px;
    }
    [id='01-chegou-card-loja'] {
      left: 101px;
      top: 470px;
      z-index: 1;
    }
    [id='01-chegou-card-vendedor'] {
      left: 381px;
      top: 430px;
      z-index: 3;
    }
    [id='01-chegou-card-cozinha'] {
      left: 661px;
      top: 470px;
      z-index: 2;
    }
    [class~='01-chegou-card-inner'] {
      position: absolute;
      inset: 0;
    }
    [class~='01-chegou-bloom'] {
      position: absolute;
      inset: 0;
      border-radius: 40px;
      box-shadow: var(--e3);
    }
    [class~='01-chegou-device'] {
      position: absolute;
      inset: 0;
      box-sizing: border-box;
      padding: 8px;
      border-radius: 40px;
      background: linear-gradient(150deg, #34413b 0%, #121a16 45%, #0b100d 100%);
      box-shadow:
        inset 0 0 0 1.5px rgb(255 255 255 / 0.08),
        0 8px 16px rgb(18 60 50 / 0.12),
        0 30px 70px rgb(18 60 50 / 0.22);
    }
    [class~='01-chegou-screen'] {
      position: relative;
      width: 234px;
      height: 506.7px;
      border-radius: 32.5px;
      overflow: hidden;
      background: var(--canvas);
    }
    [class~='01-chegou-shot'] {
      display: block;
      width: 234px;
      height: 506.7px;
    }
    [class~='01-chegou-island'] {
      position: absolute;
      top: 8px;
      left: 79.5px;
      width: 75px;
      height: 19.6px;
      border-radius: 999px;
      background: #0b100d;
    }

    /* lime ring on the kitchen's #30 Caio card: measured 24–727 × 686–937 of 750×1624,
       ×0.312 into the 234 px screen, +8 px bezel, 10 px larger on every side */
    [id='01-chegou-ring'] {
      position: absolute;
      left: 5.5px;
      top: 212px;
      width: 239.3px;
      height: 98.3px;
      box-sizing: border-box;
      border: 6px solid var(--spark);
      border-radius: 20px;
      box-shadow:
        0 0 0 2px var(--ink),
        inset 0 0 0 2px var(--ink);
    }

    [class~='01-chegou-chip-slot'] {
      position: absolute;
      top: 1026px;
      width: 400px;
      height: 68px;
      display: flex;
      justify-content: center;
    }
    [class~='01-chegou-chip'] {
      display: block;
      white-space: nowrap;
      font:
        650 34px/40px 'Figtree Variable',
        sans-serif;
      color: var(--on-spark);
      background: var(--spark);
      padding: 14px 28px;
      border-radius: 999px;
      box-shadow: var(--e1);
    }
  </style>

  <div
    id="root"
    data-composition-id="01-chegou"
    data-start="0"

  >
    <div

    >
      <svg
        id="01-chegou-grain"
        viewBox="0 0 1080 1920"

        </filter>
        <rect width="1080" height="1920" filter="url(#01-chegou-noise)" opacity="0.025" />
      </svg>
    </div>

    <div

    ></div>

    <div

    >
      <div id="01-chegou-fan-shake">
        <div id="01-chegou-fan-drift">
          <div id="01-chegou-card-loja" class="01-chegou-card">
            <div class="01-chegou-card-inner">

                <div class="01-chegou-screen">

    <div
      id="01-chegou-logo"
      class="clip 01-chegou-layer"
      data-start="0"
      data-duration="7.75"
      data-track-index="3"
    >
      <div id="01-chegou-shock"></div>
      <div id="01-chegou-mark-move">
        <div id="01-chegou-mark-inner">
          <svg id="01-chegou-mark-night" class="01-chegou-mark" viewBox="0 0 128 128" aria-hidden="true">
            <path d="M32 48 L61 88 L98 34" />
          </svg>
          <svg id="01-chegou-mark-cream" class="01-chegou-mark" viewBox="0 0 128 128" aria-hidden="true">
            <path d="M32 48 L61 88 L98 34" />
          </svg>
        </div>
      </div>
      <div id="01-chegou-word-move">
        <span id="01-chegou-word-inner">
          <span id="01-chegou-word-night" class="01-chegou-word"
            >venduá<span class="01-chegou-dot">.</span></span
          >
          <span id="01-chegou-word-cream" class="01-chegou-word" aria-hidden="true"
            >venduá<span class="01-chegou-dot">.</span></span
          >
        </span>

  <script>
    (function () {
      const ID = '01-chegou';
      const DURATION = 7.5;
      const el = (name) => document.getElementById(`${ID}-${name}`);

      // Word starts from audio/cues.json frames["1"]; arrivals may lead by ≤0.04 s.
      const T = {
        hit: 0.0,
        vendua: 0.7,
        flip: 1.45,
        loja: 1.87,
        vendedor: 2.99,
        whatsapp: 4.45,
        cozinha: 5.25,
        tudo: 5.95,
        hora: 6.55,
        push: 6.8,
      };
      const LEAD = 0.04;

      // Lockup geometry. Big state: mark 260 box centred (506, 640); "venduá." 168 px centred
      // (506, 840). Lockup: mark 64 + "venduá." 64 px, one row centred on x 506, y 270.
      const WORD_W168 = 607; // measured width of "venduá." at 168 px
      const MARK_S = 64 / 260;
      const WORD_S = 64 / 168;
      const GAP = 10;
      const ROW_W = 64 + GAP + WORD_W168 * WORD_S;
      const ROW_L = 506 - ROW_W / 2;
      const MARK_TO = { x: ROW_L + 32 - 506, y: 270 - 640, scale: MARK_S };
      const WORD_TO = {
        x: ROW_L + 64 + GAP + (WORD_W168 * WORD_S) / 2 - 506,
        y: 270 - 840,
        scale: WORD_S,
      };

      const SHAKE_X = [10, -8, 5, -3, 0];
      const SHAKE_R = [0.6, -0.4, 0.2, -0.1, 0];
      const SHAKE_DUR = 0.25;

      const logo = el('logo');
      const shock = el('shock');
      const markMove = el('mark-move');
      const markInner = el('mark-inner');
      const markNight = el('mark-night');
      const markCream = el('mark-cream');
      const wordMove = el('word-move');
      const wordInner = el('word-inner');
      const wordNight = el('word-night');
      const wordCream = el('word-cream');
      const night = el('night');
      const fan = el('fan');
      const fanShake = el('fan-shake');
      const fanDrift = el('fan-drift');
      const ring = el('ring');

      const card = (name) => {
        const root = el(`card-${name}`);
        return {
          root,
          inner: root.querySelector('.\\30 1-chegou-card-inner'),
          bloom: root.querySelector('.\\30 1-chegou-bloom'),
          chip: el(`chip-${name}`),
        };
      };
      const loja = card('loja');
      const vendedor = card('vendedor');
      const cozinha = card('cozinha');

      // Analytic length of M32 48 L61 88 L98 34 as the fallback; the gap is twice the length so
      // no round-cap dot sits at either end before the draw.
      const paths = [markNight, markCream].map((svg) => svg.querySelector('path'));
      const measured =
        typeof paths[0].getTotalLength === 'function' ? paths[0].getTotalLength() : 0;
      const LEN = measured > 0 ? measured : Math.hypot(29, 40) + Math.hypot(37, 54);
      paths.forEach((p) => (p.style.strokeDasharray = `${LEN} ${LEN * 2}`));

      const tl = gsap.timeline({ paused: true });

      gsap.set([markInner, wordInner, logo, fanShake, fanDrift, fan, ring], {
        x: 0,
        y: 0,
        scale: 1,
        rotation: 0,
      });
      [loja, vendedor, cozinha].forEach((c) => gsap.set(c.inner, { x: 0, scale: 1 }));

      const punch = (target, peak, at) => {
        tl.to(target, { scale: peak, duration: 0.1, ease: 'power3.out' }, at);
        tl.to(target, { scale: 1, duration: 0.25, ease: 'power2.out' }, at + 0.1);
      };
      const shake = (target, at, xs = SHAKE_X, rs = SHAKE_R) => {
        const step = SHAKE_DUR / xs.length;
        xs.forEach((x, i) => {
          tl.to(
            target,
            { x, rotation: rs[i], duration: step, ease: i ? 'sine.inOut' : 'power1.out' },
            at + step * i,
          );
        });
      };
      const recoil = (target, dx, at) => {
        tl.to(target, { x: dx, duration: 0.08, ease: 'power2.out' }, at);
        tl.to(target, { x: 0, duration: 0.3, ease: 'power3.out' }, at + 0.08);
      };

      // ── Scene 1 (0–1.45): night; the check slams in and draws, "venduá." lands on "Venduá!"
      tl.fromTo(markInner, { scale: 1.3 }, { scale: 1, duration: 0.2, ease: 'expo.out' }, T.hit);
      paths.forEach((p) =>
        tl.fromTo(
          p,
          { strokeDashoffset: LEN + 1 },
          { strokeDashoffset: 0, duration: 0.25, ease: 'power2.out' },
          T.hit,
        ),
      );
      tl.fromTo(
        shock,
        { scale: 0.55, opacity: 0.9 },
        { scale: 2.6, opacity: 0, duration: 0.7, ease: 'expo.out' },
        T.hit + 0.04,
      );
      // the mark breathes forward while the voice says "Chegou o"
      tl.fromTo(markInner, { y: 0 }, { y: -10, duration: 0.5, ease: 'sine.inOut' }, 0.15);

      tl.fromTo(
        wordInner,
        { opacity: 0, scale: 1.3, y: 40 },
        { opacity: 1, scale: 1, y: 0, duration: 0.18, ease: 'expo.out' },
        T.vendua - LEAD,
      );
      tl.to(markInner, { y: 0, duration: 0.18, ease: 'expo.out' }, T.vendua - LEAD);
      punch(logo, 1.06, T.vendua + 0.12);
      shake(logo, T.vendua + 0.12);
      // slow push on the whole logo from the punch's settle up to the flip
      tl.to(logo, { scale: 1.03, duration: T.flip - (T.vendua + 0.47), ease: 'none' }, T.vendua + 0.47);

      // ── Scene 2 (1.45–1.75): ground flips to cream; the logo compacts to the lockup
      tl.fromTo(night, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: 'power2.inOut' }, T.flip);
      tl.fromTo(markCream, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power2.inOut' }, T.flip);
      tl.fromTo(markNight, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: 'power2.inOut' }, T.flip);
      tl.fromTo(wordCream, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power2.inOut' }, T.flip);
      tl.fromTo(wordNight, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: 'power2.inOut' }, T.flip);
      tl.fromTo(
        markMove,
        { x: 0, y: 0, scale: 1 },
        { ...MARK_TO, duration: 0.3, ease: 'power3.inOut' },
        T.flip,
      );
      tl.fromTo(
        wordMove,
        { x: 0, y: 0, scale: 1 },
        { ...WORD_TO, duration: 0.3, ease: 'power3.inOut' },
        T.flip,
      );
      tl.to(logo, { scale: 1, duration: 0.3, ease: 'power3.inOut' }, T.flip);

      // ── Scene 3 (1.87–6.55): the fan, one device per word — distinct slam per card
      const arrive = (c, at, rot, fromRot, dur, ease) => {
        tl.fromTo(
          c.root,
          { opacity: 0, y: 100, scale: 1.12, rotation: fromRot },
          { opacity: 1, y: 0, scale: 1, rotation: rot, duration: dur, ease },
          at - LEAD,
        );
        tl.fromTo(
          c.bloom,
          { opacity: 1 },
          { opacity: 0, duration: 0.5, ease: 'power1.out' },
          at - LEAD + dur * 0.6,
        );
        tl.fromTo(
          c.chip,
          { opacity: 0, y: 28, scale: 0.7 },
          { opacity: 1, y: 0, scale: 1, duration: 0.2, ease: 'expo.out' },
          at + 0.06,
        );
      };
      arrive(loja, T.loja, -5, -12, 0.26, 'power4.out');
      arrive(vendedor, T.vendedor, 0, 0, 0.24, 'expo.out');
      recoil(loja.inner, -12, T.vendedor + 0.12);
      arrive(cozinha, T.cozinha, 5, 12, 0.28, 'circ.out');
      recoil(vendedor.inner, -8, T.cozinha + 0.14);

      // the camera floats up under the fan the whole time it is on screen
      tl.fromTo(fanDrift, { y: 0 }, { y: -18, duration: DURATION - T.loja, ease: 'none' }, T.loja);

      // "WhatsApp": the seller punches
      punch(vendedor.inner, 1.06, T.whatsapp - 0.02);
      punch(vendedor.chip, 1.1, T.whatsapp - 0.02);

      // "vê tudo": the kitchen's #30 Caio gets the lime ring, device shakes ≤8 px
      tl.fromTo(
        ring,
        { opacity: 0, scale: 1.15 },
        { opacity: 1, scale: 1, duration: 0.15, ease: 'power4.out' },
        T.tudo,
      );
      shake(cozinha.inner, T.tudo + 0.1, [6, -5, 3, -1, 0], [0, 0, 0, 0, 0]);

      // "hora.": all three punch together with one shake
      [loja, vendedor, cozinha].forEach((c) => punch(c.inner, 1.05, T.hora - 0.02));
      shake(fanShake, T.hora - 0.02);

      // ── Scene 4 (6.8–7.5): slow push into the cut
      tl.fromTo(fan, { scale: 1 }, { scale: 1.04, duration: DURATION - T.push, ease: 'power1.in' }, T.push);

      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
