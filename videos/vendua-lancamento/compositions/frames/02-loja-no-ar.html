  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="02-loja-no-ar"]');
      var q = function (name) {
        return root.querySelector('[class~="02-loja-no-ar-' + name + '"]');
      };
      var DURATION = 8.203125;
      var tl = gsap.timeline({ paused: true });

      // a later tween on a property an earlier one owns: explicit from, no immediate render
      function step(el, from, to, at) {
        to.immediateRender = false;
        tl.fromTo(el, from, to, at);
      }
      function punch(el, s, at) {
        step(el, { scale: 1 }, { scale: s, duration: 0.1, ease: 'power3.out' }, at);
        step(el, { scale: s }, { scale: 1, duration: 0.25, ease: 'power2.out' }, at + 0.1);
      }
      var SX = [10, -8, 5, -3, 0];
      var SR = [0.6, -0.4, 0.2, -0.1, 0];
      function shake(el, at, amp) {
        for (var k = 0; k < SX.length; k++) {
          step(
            el,
            { x: k ? SX[k - 1] * amp : 0, rotation: k ? SR[k - 1] * amp : 0 },
            { x: SX[k] * amp, rotation: SR[k] * amp, duration: 0.05, ease: 'sine.inOut' },
            at + k * 0.05,
          );
        }
      }

      // ---- camera: measured boxes in screenshot px (2880 x 1800 -> 868 x 542.5 css) ----
      var K = 868 / 2880;
      var CW = 868;
      var CH = 542.5;
      function cam(box, s, dy) {
        var cx = ((box[0] + box[2]) / 2) * K;
        var cy = ((box[1] + box[3]) / 2) * K;
        var x = CW / 2 - s * cx;
        var y = CH / 2 - s * cy + (dy || 0);
        x = Math.min(0, Math.max(CW - s * CW, x));
        y = Math.min(0, Math.max(CH - s * CH, y));
        return { x: x, y: y, scale: s };
      }
      var GREET = [351, 201, 1503, 361]; // Duá avatar + greeting bubble
      var PHONE = [1808, 211, 2487, 1200]; // "Sua loja, ao vivo" + phone (label to the 2nd row)
      var NAME = [1850, 314, 2144, 386]; // "B" + "Bolos da Nena"
      var CORES = [1850, 314, 2277, 560]; // green avatar, headline, "Hoje: 7h–21h" chip
      var GRID = [1861, 638, 2434, 1296]; // product cards with prices
      var C0 = cam(GREET, 1.9);
      var C0b = cam(GREET, 2.0);
      var C1 = cam(PHONE, 1.6);
      var C2 = cam(NAME, 2.8);
      var C3 = cam(CORES, 3.6);
      var C4 = cam(GRID, 2.2);
      var C5 = { x: C4.x, y: C4.y - 16, scale: C4.scale };

      // ---- the big title state (a transform of the header) ----
      var DISC_BIG = { scale: 300 / 92, x: 0, y: 50 }; // 300 px disc at x 72, y 300
      var TITLE_BIG = { scale: 104 / 60, x: 72 - 188, y: 610 - 250 }; // 104 px title under it

      // Scene 1: "Um:" 0.08 — the disc slams in big, with a shake
      tl.set(q('disc'), DISC_BIG, 0);
      tl.set(q('title'), TITLE_BIG, 0);
      tl.fromTo(
        q('disc-face'),
        { scale: 1.12, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.22, ease: 'expo.out' },
        0.05,
      );
      shake(q('disc-face'), 0.2, 0.6);
      punch(q('disc-face'), 1.05, 0.72); // "a sua"

      // the title lands word by word: "loja" 0.98, "no" 1.30, "ar" 1.46
      tl.fromTo(
        q('w1'),
        { y: 70, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.24, ease: 'power4.out' },
        0.95,
      );
      tl.fromTo(
        q('w2'),
        { y: 70, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.2, ease: 'power4.out' },
        1.27,
      );
      tl.fromTo(
        q('w3'),
        { scale: 1.3, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.2, ease: 'expo.out' },
        1.43,
      );
      punch(q('disc-face'), 1.05, 1.8); // "cerca"

      // "uma hora." 2.24 — the chip shoots out from its left edge; punch on "hora" 2.52
      tl.fromTo(
        q('hora'),
        { x: -90, scale: 0.4, opacity: 0 },
        { x: 0, scale: 1, opacity: 1, duration: 0.24, ease: 'expo.out' },
        2.21,
      );
      punch(q('hora'), 1.06, 2.5);

      // Scene 2 (3.0–3.24, in the pause before "Você"): the title block compacts into the header
      step(
        q('disc'),
        DISC_BIG,
        { scale: 1, x: 0, y: 0, duration: 0.22, ease: 'power3.inOut' },
        3.0,
      );
      step(
        q('title'),
        TITLE_BIG,
        { scale: 1, x: 0, y: 0, duration: 0.22, ease: 'power3.inOut' },
        3.02,
      );
      step(
        q('hora'),
        { x: 0, scale: 1, opacity: 1 },
        { x: -40, scale: 0.6, opacity: 0, duration: 0.12, ease: 'power2.in' },
        2.96,
      );

      // Scene 3: "Você" 3.25 — the setup card slams up, e2 -> e1; camera on Duá's greeting
      tl.fromTo(
        q('card'),
        { y: 110, scale: 1.06, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.26, ease: 'expo.out' },
        3.21,
      );
      tl.fromTo(q('sh2'), { opacity: 1 }, { opacity: 0, duration: 0.26, ease: 'power2.out' }, 3.21);
      tl.fromTo(
        q('cam'),
        C0,
        { x: C0b.x, y: C0b.y, scale: C0b.scale, duration: 1.62, ease: 'power1.inOut' },
        3.21,
      );
      // "Duá" 4.15 — his own avatar pops over the card's top-left corner
      tl.fromTo(
        q('dua'),
        { scale: 0, opacity: 0, rotation: -8 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.3, ease: 'power3.out' },
        4.11,
      );

      // Scene 4: "monta" 4.87 — pan right to the live store phone
      step(
        q('cam'),
        C0b,
        { x: C1.x, y: C1.y, scale: C1.scale, duration: 0.3, ease: 'power3.inOut' },
        4.83,
      );
      punch(q('card'), 1.03, 5.17); // "tudo"
      punch(q('dua'), 1.08, 5.17);

      // "nome" 5.79 — punch on "Bolos da Nena"
      step(
        q('cam'),
        C1,
        { x: C2.x, y: C2.y, scale: C2.scale, duration: 0.26, ease: 'expo.out' },
        5.75,
      );
      tl.fromTo(
        q('c-nome'),
        { scale: 1.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.18, ease: 'power4.out' },
        5.76,
      );
      // "cores" 6.43 — the green avatar, headline and "Hoje: 7h–21h" chip
      step(
        q('cam'),
        C2,
        { x: C3.x, y: C3.y, scale: C3.scale, duration: 0.26, ease: 'expo.out' },
        6.39,
      );
      tl.fromTo(
        q('c-cores'),
        { x: -120, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.18, ease: 'expo.out' },
        6.4,
      );
      // "cardápio" 7.03 — the camera slides down to the product grid with prices
      step(
        q('cam'),
        C3,
        { x: C4.x, y: C4.y, scale: C4.scale, duration: 0.3, ease: 'power3.inOut' },
        6.99,
      );
      tl.fromTo(
        q('c-cardapio'),
        { y: 60, rotation: 6, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.2, ease: 'circ.out' },
        7.0,
      );

      // Scene 5: settled on the grid, a small continuous drift into the cut
      step(
        q('cam'),
        C4,
        { x: C5.x, y: C5.y, scale: C5.scale, duration: DURATION - 7.29, ease: 'none' },
        7.29,
      );

      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines['02-loja-no-ar'] = tl;
    })();
  </script>
