  <script>
    (function () {
      var byId = function (name) {
        return document.getElementById('07-cozinha-' + name);
      };
      var discpos = byId('discpos');
      var disc = byId('disc');
      var name = byId('name');
      var w1 = byId('w1');
      var w2 = byId('w2');
      var chip1 = byId('chip1');
      var chip2 = byId('chip2');
      var devwrap = byId('devwrap');
      var phone = byId('phone');
      var cam = byId('cam');
      var shota = byId('shota');
      var shotb = byId('shotb');
      var shotc = byId('shotc');
      var btn = byId('btn');
      var tap = byId('tap');
      var ring = byId('ring');
      var push = byId('push');
      var sh2 = byId('sh2');
      var sh1 = byId('sh1');
      var edge = byId('edge');

      var DURATION = 7.96875;
      var SCREEN_W = 406.2;
      var SCREEN_H = 879.6;
      var PX = SCREEN_W / 750; // 1 screenshot px in css px

      // camera that lands screenshot point (cx, cy) at the screen centre at scale s
      function camAt(s, cx, cy) {
        return { scale: s, x: SCREEN_W / 2 - s * cx * PX, y: SCREEN_H / 2 - s * cy * PX };
      }
      var CAM_ID = { scale: 1, x: 0, y: 0 };
      // #30's card from its "#30" to the "aceitar · 30 min" button (64,1028 → 686,1140)
      var CAM_ACEITAR = camAt(1.5, 300, 820);
      // the EPSON TM-T20X row (32,666 → 718,838) with "automática" (512,726 → 686,778) inside the
      // screen; the row is wider than the screen above 1.25×, so the punch stops there
      var CAM_EPSON = camAt(1.25, 410, 752);

      // big title state: disc 300 px at (72, 300); name at 104 px, x 72, centre y 692
      var DISC_BIG = { scale: 300 / 92, y: 50 };
      var NAME_BIG = { scale: 104 / 60, x: -116, y: 396 };

      function c(o) {
        return Object.assign({}, o);
      }
      function shake(target, at, amp) {
        tl.to(
          target,
          {
            keyframes: {
              x: [0, amp, -amp * 0.75, amp * 0.5, -amp * 0.25, 0],
              easeEach: 'sine.inOut',
            },
            duration: 0.25,
            ease: 'none',
          },
          at,
        );
      }
      function punch(target, at, s) {
        tl.fromTo(
          target,
          { scale: 1 },
          { scale: s, duration: 0.1, ease: 'power2.out', immediateRender: false },
          at,
        );
        tl.fromTo(
          target,
          { scale: s },
          { scale: 1, duration: 0.25, ease: 'power2.out', immediateRender: false },
          at + 0.1,
        );
      }

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0–2.7): "Três:" slams the disc in big; the title lands word by word.
      tl.fromTo(discpos, c(DISC_BIG), { scale: DISC_BIG.scale, y: DISC_BIG.y, duration: 0.01 }, 0);
      tl.fromTo(name, c(NAME_BIG), { scale: NAME_BIG.scale, x: NAME_BIG.x, y: NAME_BIG.y, duration: 0.01 }, 0);
      tl.fromTo(
        disc,
        { scale: 1.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.22, ease: 'expo.out' },
        0.05,
      );
      shake(discpos, 0.24, 10);
      // "cozinha" snaps in from the side, "vê" rises with a small turn
      tl.fromTo(
        w1,
        { x: -70, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.22, ease: 'expo.out' },
        0.85,
      );
      tl.fromTo(
        w2,
        { y: 46, rotation: 8, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.24, ease: 'power4.out' },
        1.29,
      );
      punch(disc, 1.56, 1.06);
      // "hora." shoots the chip out under the title
      tl.fromTo(
        chip1,
        { y: -60, scale: 0.6, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.22, ease: 'expo.out' },
        2.09,
      );

      // Scene 2 (2.7–2.95): the title compacts into the header; the phone slams into its box.
      tl.fromTo(
        discpos,
        { scale: DISC_BIG.scale, y: DISC_BIG.y },
        { scale: 1, y: 0, duration: 0.25, ease: 'power4.out', immediateRender: false },
        2.7,
      );
      tl.fromTo(
        name,
        { scale: NAME_BIG.scale, x: NAME_BIG.x, y: NAME_BIG.y },
        { scale: 1, x: 0, y: 0, duration: 0.25, ease: 'power4.out', immediateRender: false },
        2.7,
      );
      tl.fromTo(
        chip1,
        { scale: 1, opacity: 1 },
        { scale: 0.7, opacity: 0, duration: 0.14, ease: 'power2.in', immediateRender: false },
        2.7,
      );
      tl.fromTo(
        devwrap,
        { y: 160, scale: 1.08, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.25, ease: 'expo.out' },
        2.7,
      );

      // Scene 3 (2.964–4.5): on "pedido" the push slams down from above with its lime edge.
      tl.fromTo(
        push,
        { y: -220, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.24, ease: 'expo.out' },
        2.93,
      );
      tl.fromTo(sh2, { opacity: 1 }, { opacity: 0, duration: 0.24, ease: 'power2.out' }, 2.93);
      tl.fromTo(sh1, { opacity: 0 }, { opacity: 1, duration: 0.24, ease: 'power2.out' }, 2.93);
      tl.fromTo(edge, { opacity: 1 }, { opacity: 0, duration: 0.9, ease: 'power1.in' }, 3.2);
      // double buzz on the phone, ±5 px
      [3.0, 3.15].forEach(function (at) {
        tl.to(
          phone,
          {
            keyframes: { x: [0, -5, 5, -3, 2, 0], easeEach: 'sine.inOut' },
            duration: 0.14,
            ease: 'none',
          },
          at,
        );
      });
      punch(push, 3.84, 1.05);

      // Scene 4 (4.5–5.8): the push leaves upward; the camera punches onto #30 and its button.
      tl.fromTo(
        push,
        { y: 0, opacity: 1 },
        { y: -260, opacity: 0, duration: 0.22, ease: 'power3.in', immediateRender: false },
        4.5,
      );
      tl.fromTo(
        cam,
        c(CAM_ID),
        Object.assign({ duration: 0.28, ease: 'expo.out', immediateRender: false }, CAM_ACEITAR),
        4.56,
      );
      // "toque,": tap ring + the real button presses
      tl.fromTo(tap, { scale: 0.4, opacity: 0 }, { opacity: 1, duration: 0.01 }, 5.24);
      tl.to(tap, { scale: 1.5, opacity: 0, duration: 0.35, ease: 'power2.out' }, 5.25);
      tl.fromTo(
        btn,
        { scale: 1 },
        { scale: 0.94, duration: 0.08, ease: 'power2.out', immediateRender: false },
        5.25,
      );
      tl.fromTo(
        btn,
        { scale: 0.94 },
        { scale: 1, duration: 0.14, ease: 'power2.out', immediateRender: false },
        5.33,
      );
      // 5.40: the board swaps to the accepted state ("Pedido #30 aceito"), camera back to 1×
      tl.fromTo(
        shota,
        { opacity: 1 },
        { opacity: 0, duration: 0.12, ease: 'power1.out', immediateRender: false },
        5.4,
      );
      tl.fromTo(
        shotb,
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.2, ease: 'expo.out' },
        5.4,
      );
      tl.fromTo(
        cam,
        c(CAM_ACEITAR),
        Object.assign({ duration: 0.25, ease: 'power3.inOut', immediateRender: false }, CAM_ID),
        5.4,
      );
