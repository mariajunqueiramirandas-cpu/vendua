  <script>
    (function () {
      var NS = '05-dua-vende';
      var DURATION = 8.671875;
      var root = document.querySelector('[data-composition-id="' + NS + '"]');
      var part = function (name) {
        return root.getElementsByClassName(NS + '-' + name)[0];
      };
      var parts = function (name) {
        return Array.prototype.slice.call(root.getElementsByClassName(NS + '-' + name));
      };

      var rig = part('rig');
      var cam = part('cam');
      var shots = [part('s1'), part('s2'), part('s3'), part('s4'), part('s5')];
      var ring = part('ring');
      var chipwrap = part('chipwrap');
      var chipbloom = part('chipbloom');
      var connH = part('conn-h');
      var connV = part('conn-v');
      var connDot = part('conn-dot');
      var badge = part('badge');
      var bars = parts('bar');

      // Camera inside the screen: origin 0 0, target (capture px) centred in the 406.2×879.6
      // screen, clamped so the camera never leaves the capture.
      var K = 406.2 / 750;
      var SW = 406.2;
      var SH = 879.6;
      var camAt = function (s, tx, ty) {
        var x = SW / 2 - s * K * tx;
        var y = SH / 2 - s * K * ty;
        x = Math.min(0, Math.max(SW * (1 - s), x));
        y = Math.min(0, Math.max(SH * (1 - s), y));
        return { x: x, y: y, scale: s };
      };
      var HOME = { x: 0, y: 0, scale: 1 };
      // price bubble x 141–718, y 929–1098: right-framed so "R$ 45,00." is whole, bubble high
      var PRICE = camAt(1.75, 512, 1146);
      // add-on bubble x 141–718, y 527–748 (its "Sai R$ / 9,50." wraps): the whole bubble
      var ADDON = camAt(1.3, 430, 638);
      // summary card x 116–716, y 757–1200; "Total R$ 62,50" row x 143–688, y 1102–1132
      var TOTAL = camAt(1.32, 416, 1030);
      // Pix card x 114–717, y 416–643
      var PIX = camAt(1.2, 415.5, 529.5);

      var tl = gsap.timeline({ paused: true });

      var camMove = function (from, to, at, dur, ease) {
        tl.fromTo(
          cam,
          { x: from.x, y: from.y, scale: from.scale },
          { x: to.x, y: to.y, scale: to.scale, duration: dur, ease: ease, immediateRender: false },
          at,
        );
      };

      // new screen arrives like new messages: slides up 140 px, the old one fades under it
      var swap = function (i, at) {
        tl.fromTo(shots[i], { y: 140 }, { y: 0, duration: 0.22, ease: 'expo.out' }, at);
        tl.fromTo(shots[i], { opacity: 0 }, { opacity: 1, duration: 0.08, ease: 'power2.out' }, at);
        tl.fromTo(
          shots[i - 1],
          { opacity: 1 },
          { opacity: 0, duration: 0.22, ease: 'power2.out', immediateRender: false },
          at,
        );
      };

      var punch = function (at, s) {
        tl.fromTo(
          rig,
          { scale: 1 },
          { scale: s, duration: 0.1, ease: 'power2.out', immediateRender: false },
          at,
        );
        tl.fromTo(
          rig,
          { scale: s },
          { scale: 1, duration: 0.25, ease: 'power2.out', immediateRender: false },
          at + 0.1,
        );
      };

      // fixed decaying shake of the whole device (x/y/rotation; punches own its scale)
      var shake = function (at, xs, ys, rs, dur) {
        var step = dur / xs.length;
        var px = 0;
        var py = 0;
        var pr = 0;
        for (var i = 0; i < xs.length; i++) {
          tl.fromTo(
            rig,
            { x: px, y: py, rotation: pr },
            {
              x: xs[i],
              y: ys[i],
              rotation: rs[i],
              duration: step,
              ease: 'sine.inOut',
              immediateRender: false,
            },
            at + i * step,
          );
          px = xs[i];
          py = ys[i];
          pr = rs[i];
        }
      };

      // Scene 1 (0–1.1): handoff state, bars at frame 04's rest (scaleY 0.2); "ouve" 0.26 —
      // one last pulse, then the badge drops away
      var REST = 0.2;
      var PEAK = [0.6, 0.9, 1, 0.8, 0.56];
      bars.forEach(function (bar, i) {
        tl.fromTo(
          bar,
          { scaleY: REST },
          { scaleY: PEAK[i], duration: 0.08, ease: 'power2.out' },
          0.26 + i * 0.012,
        );
        tl.fromTo(
          bar,
          { scaleY: PEAK[i] },
          { scaleY: REST, duration: 0.12, ease: 'power2.in', immediateRender: false },
          0.34 + i * 0.012,
        );
      });
      tl.fromTo(
        badge,
        { y: 0, scale: 1, opacity: 1 },
        { y: 90, scale: 0.86, opacity: 0, duration: 0.18, ease: 'power2.in', immediateRender: false },
        0.42,
      );
      punch(0.66, 1.03); // "áudio"

      // Scene 2 (1.16–4.6): "responde" → the price screen
      swap(1, 1.16);
      punch(1.82, 1.04); // "hora,"
      // "preço" 2.52 — camera punches onto the R$ 45,00 bubble
      tl.fromTo(
        cam,
        { x: HOME.x, y: HOME.y, scale: HOME.scale },
        { x: PRICE.x, y: PRICE.y, scale: PRICE.scale, duration: 0.28, ease: 'expo.out' },
        2.5,
      );
      // "cardápio," 3.12 — the spark-chip slams in, the connector draws to the price
      tl.fromTo(
        chipwrap,
        { scale: 1.25, x: -40, opacity: 0 },
        { scale: 1, x: 0, opacity: 1, duration: 0.22, ease: 'power4.out' },
        3.1,
      );
      tl.fromTo(chipbloom, { opacity: 1 }, { opacity: 0, duration: 0.28, ease: 'power2.out' }, 3.1);
      tl.fromTo(connH, { scaleX: 0 }, { scaleX: 1, duration: 0.09, ease: 'power2.out' }, 3.24);
      tl.fromTo(connV, { scaleY: 0 }, { scaleY: 1, duration: 0.1, ease: 'power2.out' }, 3.32);
      tl.fromTo(connDot, { scale: 0 }, { scale: 1, duration: 0.14, ease: 'expo.out' }, 3.4);
      punch(3.96, 1.05); // "chute."

      // Scene 3 (4.77–6.3): camera back to 1×, the chip clears; "fatia" → the add-on screen
      camMove(PRICE, HOME, 4.77, 0.25, 'power3.inOut');
      tl.fromTo(
        [chipwrap, connH, connV, connDot],
        { opacity: 1 },
        { opacity: 0, duration: 0.16, ease: 'power2.in', immediateRender: false },
        4.77,
      );
      swap(2, 5.305);
      camMove(HOME, ADDON, 5.42, 0.26, 'expo.out');
      punch(5.77, 1.04); // "mais,"

      // Scene 4 (6.35–7.6): "fecha" → the summary; camera onto Total R$ 62,50 on "pedido"
      swap(3, 6.35);
      camMove(ADDON, HOME, 6.35, 0.22, 'power3.inOut');
      camMove(HOME, TOTAL, 6.65, 0.28, 'expo.out');
      punch(7.33, 1.04); // "manda"

      // Scene 5 (7.725–8.672): "Pix." → the Pix screen; lime ring snaps on with a shake
      swap(4, 7.705);
      camMove(TOTAL, PIX, 7.705, 0.26, 'expo.out');
      tl.fromTo(
        ring,
        { scale: 1.15, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.15, ease: 'power4.out' },
        7.88,
      );
      shake(
        7.88,
        [8, -6, 4, -2.5, 1, 0],
        [-2, 1.5, -1, 0.5, 0, 0],
        [0.6, -0.4, 0.25, -0.1, 0.05, 0],
        0.25,
      );
      // camera eases back to 1× by 8.5; the ring releases with it (frame 06 starts clean)
      camMove(PIX, HOME, 8.2, 0.3, 'power3.inOut');
      tl.fromTo(
        ring,
        { opacity: 1 },
        { opacity: 0, duration: 0.24, ease: 'power2.in', immediateRender: false },
        8.24,
      );

      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines['05-dua-vende'] = tl;
    })();
  </script>
