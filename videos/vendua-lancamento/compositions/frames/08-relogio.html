    /* lime ring around "Pronto" (750 px shot: x 36–221, y 123–166; 1 px = 0.33405 css) */

  </style>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var byId = function (name) {
        return document.getElementById('08-relogio-' + name);
      };
      var tablet = byId('tablet');
      var cam = byId('cam');
      var kds1 = byId('kds1');
      var kds2 = byId('kds2');
      var btn = byId('btn');
      var tap = byId('tap');
      var phone = byId('phone');
      var ring = byId('ring');
      var chips = [byId('c1'), byId('c2'), byId('c3'), byId('c4'), byId('c5')];

      var DURATION = 7.96875;
      var SW = 826.4;
      var SH = 516.5;
      var K = SW / 2560; // 1 screenshot px = 0.3228 css px

      // camera state that centres screenshot point (px, py) at scale s, clamped to the shot
      function view(px, py, s) {
        var x = SW / 2 - s * px * K;
        var y = SH / 2 - s * py * K;
        x = Math.min(0, Math.max(SW * (1 - s), x));
        y = Math.min(0, Math.max(SH * (1 - s), y));
        return { x: x, y: y, scale: s };
      }
      // measured centres (2560×1600 shots)
      var HOME = { x: 0, y: 0, scale: 1 };
      var DRIFT = view(832.5, 872.5, 1.06);
      var C30 = view(832.5, 872.5, 2.2); // "14:37 faltam 15 min" x 755–910, y 830–915
      var C30b = view(832.5, 872.5, 2.27);
      var C28 = view(1779, 256.5, 2.2); // "21:37 faltam 8 min" x 1704–1854, y 214–299
      var C27 = view(818, 256.5, 2.2); // "39:37 atrasado 10 min" x 726–910, y 214–299 + stripes
      var BTN = { x: 462.5, y: 1285.5 }; // #30 "pronto" button x 132–793, y 1228–1343
      var T30 = view(BTN.x, BTN.y, 1.3);
      var T30b = view(BTN.x, BTN.y, 1.38);
      var T30c = view(BTN.x, BTN.y, 1.45);

      function camMove(from, to, at, dur, ease) {
        tl.fromTo(
          cam,
          { x: from.x, y: from.y, scale: from.scale },
          {
            x: to.x,
            y: to.y,
            scale: to.scale,
            duration: dur,
            ease: ease,
            immediateRender: false,
          },
          at,
        );
      }
      function punch(el, at, amt) {
        tl.fromTo(
          el,
          { scale: 1 },
          { scale: amt, duration: 0.1, ease: 'power2.out', immediateRender: false },
          at,
        );
        tl.fromTo(
          el,
          { scale: amt },
          { scale: 1, duration: 0.25, ease: 'power2.out', immediateRender: false },
          at + 0.1,
        );
      }
      function chipIn(el, at) {
        tl.fromTo(
          el,
          { y: 60, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.22, ease: 'expo.out', immediateRender: false },
          at,
        );
      }
      function chipOut(el, at) {
        tl.fromTo(
          el,
          { y: 0, opacity: 1 },
          { y: -28, opacity: 0, duration: 0.14, ease: 'power2.in', immediateRender: false },
          at,
        );
      }

      var tl = gsap.timeline({ paused: true });

      tl.set(cam, { x: 0, y: 0, scale: 1, transformOrigin: '0 0' }, 0);
      tl.set([kds1, kds2, btn], { opacity: 0 }, 0);
      tl.set(tap, { opacity: 0 }, 0);
      tl.set(chips, { opacity: 0 }, 0);
      tl.set(ring, { opacity: 0 }, 0);
      tl.set(phone, { opacity: 0, rotation: 4 }, 0);

      // Scene 1 (0–1.2): the tablet slams up on the kitchen display; punch on "cozinha,"
      tl.fromTo(tablet, { y: 110, scale: 1.06 }, { y: 0, scale: 1, duration: 0.26, ease: 'expo.out' }, 0);
      tl.fromTo(tablet, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: 'power2.out' }, 0);
      punch(tablet, 0.6, 1.05);

      // Scene 2 (1.30–4.0): the camera reads the clocks
      camMove(HOME, DRIFT, 1.3, 0.9, 'sine.inOut');
      camMove(DRIFT, C30, 2.22, 0.28, 'expo.out'); // "relógio"
      chipIn(chips[0], 2.24);
      camMove(C30, C30b, 2.5, 0.78, 'sine.inOut');
      camMove(C30b, C28, 3.28, 0.24, 'expo.out'); // "antes"
      chipOut(chips[0], 3.26);
      chipIn(chips[1], 3.32);
      camMove(C28, C27, 3.78, 0.24, 'expo.out'); // "atrasar."
      chipOut(chips[1], 3.76);
      chipIn(chips[2], 3.82);
      tl.to(
        tablet,
        {
          keyframes: { x: [0, 10, -8, 5, -3, 0], rotation: [0, 0.6, -0.4, 0.2, 0, 0] },
          duration: 0.25,
          ease: 'none',
        },
        3.86,
      );

      // Scene 3 (4.38–6.0): back to 1.3× on #30; items ticked; one tap → pronto
      camMove(C27, T30, 4.38, 0.25, 'power3.inOut');
      chipOut(chips[2], 4.4);
      chipIn(chips[3], 4.48);
      tl.fromTo(
        [kds1, btn],
        { opacity: 0 },
        { opacity: 1, duration: 0.12, ease: 'power1.out', immediateRender: false },
        4.62,
      ); // "Ficou"
      camMove(T30, T30b, 4.76, 0.96, 'sine.inOut');

      // tap ring at the button's centre in screen space (camera at T30b from 5.72)
      var tx = T30b.x + T30b.scale * BTN.x * K;
      var ty = T30b.y + T30b.scale * BTN.y * K;
      tap.style.left = (tx - 36).toFixed(2) + 'px';
      tap.style.top = (ty - 36).toFixed(2) + 'px';
      tl.fromTo(
        tap,
        { scale: 0.4, opacity: 1 },
        { scale: 1.5, opacity: 0, duration: 0.35, ease: 'power2.out', immediateRender: false },
        5.755,
      );
      tl.fromTo(btn, { scale: 1 }, { scale: 0.94, duration: 0.08, ease: 'power2.out', immediateRender: false }, 5.755);
      tl.fromTo(btn, { scale: 0.94 }, { scale: 1, duration: 0.14, ease: 'power2.out', immediateRender: false }, 5.835);
      tl.fromTo(
        kds2,
        { opacity: 0 },
        { opacity: 1, duration: 0.12, ease: 'power1.out', immediateRender: false },
        5.84,
      );
      chipOut(chips[3], 5.82);
      chipIn(chips[4], 5.88);
      camMove(T30b, T30c, 5.98, 1.98, 'sine.inOut');

      // Scene 4 (6.17–end): Caio's phone slams up over the tablet; lime ring on "Pronto"
      tl.fromTo(
        phone,
        { y: 120, scale: 1.12, rotation: 4 },
        { y: 0, scale: 1, rotation: 4, duration: 0.24, ease: 'expo.out', immediateRender: false },
        6.15,
      );
      tl.fromTo(
        phone,
        { opacity: 0 },
        { opacity: 1, duration: 0.06, ease: 'power2.out', immediateRender: false },
        6.15,
      );
      tl.fromTo(
        ring,
        { scale: 1.15, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.15, ease: 'expo.out', immediateRender: false },
        6.54,
      );
      tl.to(phone, { keyframes: { x: [0, 8, -6, 4, -2, 0] }, duration: 0.22, ease: 'none' }, 6.6);
      punch(phone, 7.05, 1.05); // "sabendo."

      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines['08-relogio'] = tl;
    })();
  </script>
