  <script>
    (function () {
      var NS = '03-pix';
      var DURATION = 6.09375;
      var root = document.querySelector('[data-composition-id="' + NS + '"]');
      var part = function (name) {
        return root.getElementsByClassName(NS + '-' + name)[0];
      };

      var grp = part('grp');
      var dev = part('dev');
      var shk = part('shk');
      var pun = part('pun');
      var dbloom = part('dbloom');
      var cam = part('cam');
      var shotA = part('shot-a');
      var shotB = part('shot-b');
      var plus = part('plus');
      var ring = part('ring');
      var tapPlus = part('tap-plus');
      var tapLink = part('tap-link');
      var link = part('link');
      var blLink = part('bl-link');
      var cad = part('cad');
      var blCad = part('bl-cad');
      var mp = part('mp');
      var blMp = part('bl-mp');

      // Camera on the Pix row: scale from the screen's top-left keeps the row's rounded left end,
      // radio and "Pix" in view; y +20 drops the store header fully below the link pill (screen
      // top is cream, so the 20 px above the shot reads as page). Row centre lands at canvas y 810.
      var ZOOM = 1.45;
      var CREEP = 1.5;
      var CAM_Y = 20;

      var tl = gsap.timeline({ paused: true });

      var shake = function (at) {
        var xs = [8, -6, 4, -2, 0];
        var rs = [0.5, -0.35, 0.2, -0.1, 0];
        var step = 0.25 / xs.length;
        var px = 0;
        var pr = 0;
        for (var i = 0; i < xs.length; i++) {
          tl.fromTo(
            shk,
            { x: px, rotation: pr },
            { x: xs[i], rotation: rs[i], duration: step, ease: 'sine.inOut', immediateRender: false },
            at + i * step,
          );
          px = xs[i];
          pr = rs[i];
        }
      };
      var punch = function (el, at, s) {
        tl.fromTo(el, { scale: 1 }, { scale: s, duration: 0.1, ease: 'power2.out', immediateRender: false }, at);
        tl.fromTo(el, { scale: s }, { scale: 1, duration: 0.25, ease: 'power2.out', immediateRender: false }, at + 0.1);
      };
      var press = function (el, at) {
        tl.fromTo(el, { scale: 1 }, { scale: 0.94, duration: 0.08, ease: 'power2.out', immediateRender: false }, at);
        tl.fromTo(el, { scale: 0.94 }, { scale: 1, duration: 0.14, ease: 'power2.out', immediateRender: false }, at + 0.08);
      };
      var tap = function (el, at) {
        tl.fromTo(el, { scale: 0.4, opacity: 1 }, { scale: 1.5, opacity: 0, duration: 0.35, ease: 'power2.out', immediateRender: false }, at);
      };
      var bloomOut = function (el, at, dur) {
        tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: dur, ease: 'power2.out' }, at);
      };

      // Scene 1 — the phone slams up from 120 px below onto the Cardápio
      tl.fromTo(dev, { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.22, ease: 'expo.out' }, 0);
      bloomOut(dbloom, 0, 0.28);
      punch(pun, 0.62, 1.03); // "pede"

      // Scene 2 — "link," 1.04: the link pill slams over the phone's top edge, tapped, device shakes
      tl.fromTo(
        link,
        { y: -80, scale: 1.12, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.22, ease: 'power4.out' },
        1.0,
      );
      bloomOut(blLink, 1.0, 0.24);
      shake(1.06);
      tap(tapLink, 1.18);
      press(link, 1.18);

      // Scene 3 — "cadastro," 1.78: spark-chip pops at the phone's left edge
      tl.fromTo(
        cad,
        { y: 70, scale: 1.12, rotation: -4, opacity: 0 },
        { y: 0, scale: 1, rotation: -4, opacity: 1, duration: 0.22, ease: 'expo.out' },
        1.75,
      );
      bloomOut(blCad, 1.75, 0.24);

      // "paga" 2.64: the customer taps the Bolo de cenoura "+" (real pixels press)
      tap(tapPlus, 2.62);
      press(plus, 2.62);

      // Scene 4 — "Pix," 3.04: scale-swap to the checkout + camera punch onto the Pix row
      tl.fromTo(shotA, { scale: 1, opacity: 1 }, { scale: 0.88, opacity: 0, duration: 0.12, ease: 'power2.in' }, 3.01);
      tl.fromTo(
        shotB,
        { scale: 0.88, y: 30, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.2, ease: 'expo.out' },
        3.05,
      );
      tl.fromTo(cam, { scale: 1, y: 0 }, { scale: ZOOM, y: CAM_Y, duration: 0.28, ease: 'expo.out' }, 3.04);
      tl.fromTo(ring, { scale: 1.15, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.15, ease: 'power4.out' }, 3.1);
      shake(3.1);
      // slow creep while "direto na sua conta" plays, so the held punch never freezes
      tl.fromTo(
        cam,
        { scale: ZOOM },
        { scale: CREEP, duration: 1.28, ease: 'sine.inOut', immediateRender: false },
        3.34,
      );

      // Scene 5 — camera back to 1x; "Mercado" 4.76: the surface chip slams over the phone's bottom
      tl.fromTo(
        cam,
        { scale: CREEP, y: CAM_Y },
        { scale: 1, y: 0, duration: 0.25, ease: 'power3.inOut', immediateRender: false },
        4.6,
      );
      tl.fromTo(
        mp,
        { y: 100, scale: 1.12, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.24, ease: 'expo.out' },
        4.72,
      );
      bloomOut(blMp, 4.72, 0.26);
      punch(mp, 5.06, 1.05); // "Pago."

      // settle: a quiet push on the phone group, no exit (the next frame cuts in)
      tl.fromTo(grp, { scale: 1 }, { scale: 1.015, duration: DURATION - 5.4, ease: 'sine.inOut' }, 5.4);

      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines['03-pix'] = tl;
    })();
  </script>
