  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="03-um-link"]');
      var q = function (name) {
        return root.querySelector('[class~="03-um-link-' + name + '"]');
      };
      var DURATION = 3.046875;
      var HIT = 0.25; // "Venduá," + hit
      var BEAT = 0.703; // the bed's beat in the hold before "responde"
      var PUNCH = 1.33; // "responde"
      var TAP = 2.23; // "link" + tap
      var GONE = 2.63; // ripple and ring gone; settled after
      var tl = gsap.timeline({ paused: true });

      // a later tween on a property an earlier one owns: explicit from, no immediate render
      function step(el, from, to, at) {
        to.immediateRender = false;
        tl.fromTo(el, from, to, at);
      }

      // Scene 1 (0-0.23): the ten ghosts leave Frame 2's slots for the pill's centre (504, 810),
      // the farthest first, so all ten vanish together at 0.23. [slot, dx, dy, rotation, opacity]
      [
        ['l', 127.5, 469.5, -2, 0.55],
        ['m', -50, 378.5, 2.5, 1],
        ['s', -40, -357.5, 2.5, 1],
        ['a', 84, 286.5, -1.5, 1],
        ['t', 40, -265.5, -1, 1],
        ['r', -82, 194.5, 3, 1],
        ['d', -70, -173.5, 2, 1],
        ['p', 96, -81.5, -2.5, 1],
        ['j', 60, 102.5, -3, 1],
        ['c', -30, 10.5, 1.5, 1],
      ].forEach(function (g, i) {
        var at = Math.floor(i / 2) * 0.0075;
        tl.fromTo(
          q('ghost-' + g[0]),
          { x: 0, y: 0, rotation: g[3], scale: 1, opacity: g[4] },
          {
            x: g[1],
            y: g[2],
            rotation: 0,
            scale: 0.72,
            opacity: 0,
            duration: 0.23 - at,
            ease: 'power2.in',
          },
          at,
        );
      });

      // Scene 2 (0.25): the pill slams in, e2 -> e1 in the same 0.2 s, and shakes (<=10 px)
      tl.fromTo(q('pill'), { scale: 1.15 }, { scale: 1, duration: 0.2, ease: 'expo.out' }, HIT);
      tl.fromTo(q('pill'), { opacity: 0 }, { opacity: 1, duration: 0.05, ease: 'none' }, HIT);
      tl.fromTo(q('sh2'), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: 'power2.out' }, HIT);
      var SX = [10, -8, 6, -4, 2.5, -1, 0];
      var SY = [-4, 3, -2, 1.5, -0.8, 0.3, 0];
      var SR = [0.6, -0.5, 0.35, -0.2, 0.1, -0.04, 0];
      for (var k = 0; k < SX.length; k++) {
        step(
          q('pill'),
          { x: k ? SX[k - 1] : 0, y: k ? SY[k - 1] : 0, rotation: k ? SR[k - 1] : 0 },
          { x: SX[k], y: SY[k], rotation: SR[k], duration: 0.036, ease: 'sine.inOut' },
          HIT + k * 0.036,
        );
      }
      tl.fromTo(
        q('mark'),
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.22, ease: 'power4.out' },
        HIT + 0.05,
      );
      tl.fromTo(
        q('url'),
        { x: -18, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.25, ease: 'power4.out' },
        HIT + 0.05,
      );

      // Scene 3: a beat pulse in the hold, then a small punch on "responde"
      step(q('pill'), { scale: 1 }, { scale: 1.02, duration: 0.08, ease: 'power3.out' }, BEAT);
      step(
        q('pill'),
        { scale: 1.02 },
        { scale: 1, duration: 0.2, ease: 'power2.out' },
        BEAT + 0.08,
      );
      step(q('pill'), { scale: 1 }, { scale: 1.04, duration: 0.1, ease: 'power3.out' }, PUNCH);
      step(
        q('pill'),
        { scale: 1.04 },
        { scale: 1, duration: 0.25, ease: 'power2.out' },
        PUNCH + 0.1,
      );

      // Scene 4: the ring comes down during "um" and lands on "link"; press 0.965 and back in 0.18 s
      tl.fromTo(
        q('tap'),
        { scale: 1.4, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.12, ease: 'power3.out' },
        TAP - 0.12,
      );
      step(q('tap'), { scale: 1 }, { scale: 0.86, duration: 0.06, ease: 'power2.out' }, TAP);
      step(q('pill'), { scale: 1 }, { scale: 0.965, duration: 0.07, ease: 'power2.out' }, TAP);
      step(q('sh1'), { opacity: 1 }, { opacity: 0.35, duration: 0.07, ease: 'power2.out' }, TAP);
      step(q('dim'), { opacity: 0 }, { opacity: 0.06, duration: 0.07, ease: 'power2.out' }, TAP);
      // release with no overshoot (the video bans back/elastic eases)
      step(
        q('pill'),
        { scale: 0.965 },
        { scale: 1, duration: 0.11, ease: 'power2.out' },
        TAP + 0.07,
      );
      step(
        q('sh1'),
        { opacity: 0.35 },
        { opacity: 1, duration: 0.11, ease: 'power2.out' },
        TAP + 0.07,
      );
      step(
        q('dim'),
        { opacity: 0.06 },
        { opacity: 0, duration: 0.11, ease: 'power2.out' },
        TAP + 0.07,
      );
      step(
        q('tap'),
        { scale: 0.86, opacity: 1 },
        { scale: 1.8, opacity: 0, duration: 0.3, ease: 'power2.out' },
        TAP + 0.06,
      );
      // ripple: spreads from contact, gone by 2.63
      tl.fromTo(
        q('ripple'),
        { scale: 1 },
        { scale: 3.4, duration: GONE - (TAP + 0.01), ease: 'power2.out' },
        TAP + 0.01,
      );
      tl.fromTo(
        q('ripple'),
        { opacity: 0 },
        { opacity: 0.6, duration: 0.04, ease: 'none' },
        TAP + 0.01,
      );
      step(
        q('ripple'),
        { opacity: 0.6 },
        { opacity: 0, duration: GONE - (TAP + 0.05), ease: 'power1.out' },
        TAP + 0.05,
      );

      // Scene 5 (2.63-3.047): settled; the push-slide takes it from 3.047
      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines['03-um-link'] = tl;
    })();
  </script>
