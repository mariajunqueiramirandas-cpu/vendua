  <script>
    (function () {
      var NS = '04-cardapio-preco-pix';
      var DURATION = 4.4;
      var root = document.querySelector('[data-composition-id="' + NS + '"]');
      var part = function (name) {
        return root.getElementsByClassName(NS + '-' + name)[0];
      };

      var settle = part('settle');
      var bloom = part('bloom');
      var strip = part('strip');
      var camOuter = part('cam-outer');
      var camInner = part('cam-inner');
      var ring = part('ring');

      // Punch-in target from fixed geometry (no runtime measurement): screen origin 311,264
      // (phone 295,248 + 16 padding), capture CSS px x 458/375. Target = the title + price block's
      // horizontal centre (CSS x 137.25) on the "R$ 48,00" line (CSS y 619.6) of the product page.
      var K = 458 / 375;
      var TARGET_X = 311 + 137.25 * K;
      var TARGET_Y = 264 + 619.6 * K;
      var CX = 540;
      var CY = 960;
      var FOCUS_X = 506; // centre of the x 72–940 safe column
      var FOCUS_Y = 780; // centre of the readable band (y 240–1280)
      var ZOOM = 1.5; // 750px source shows at 458 x 1.5 = 687px: no upsampling
      // nested wrappers: final = C + S·(p + T − C)  →  T = (F − C)/S − (p − C)
      var TX = (FOCUS_X - CX) / ZOOM - (TARGET_X - CX);
      var TY = (FOCUS_Y - CY) / ZOOM - (TARGET_Y - CY);

      var SCREEN_W = 458;

      var tl = gsap.timeline({ paused: true });

      // Scene 1 — the phone settles in on the cardápio: short drop, lifted shadow lands
      tl.fromTo(
        settle,
        { y: -24, scale: 0.97 },
        { y: 0, scale: 1, duration: 0.9, ease: 'power3.out' },
        0,
      );
      tl.fromTo(bloom, { opacity: 1 }, { opacity: 0, duration: 0.9, ease: 'power2.out' }, 0);

      // Scene 2 — "preço": swipe to the product page, then punch in on R$ 48,00 and hold
      tl.fromTo(strip, { x: 0 }, { x: -SCREEN_W, duration: 0.6, ease: 'expo.out' }, 1.7);
      tl.fromTo(camOuter, { scale: 1 }, { scale: ZOOM, duration: 1.0, ease: 'power3.inOut' }, 1.8);
      tl.fromTo(
        camInner,
        { x: 0, y: 0 },
        { x: TX, y: TY, duration: 1.0, ease: 'power3.inOut' },
        1.8,
      );

      // Scene 3 — "Pix": swipe to the payment step while the camera eases back to the full phone
      tl.fromTo(
        strip,
        { x: -SCREEN_W },
        { x: -2 * SCREEN_W, duration: 0.6, ease: 'expo.out', immediateRender: false },
        3.52,
      );
      tl.fromTo(
        camOuter,
        { scale: ZOOM },
        { scale: 1, duration: 0.62, ease: 'power3.out', immediateRender: false },
        3.52,
      );
      tl.fromTo(
        camInner,
        { x: TX, y: TY },
        { x: 0, y: 0, duration: 0.62, ease: 'power3.out', immediateRender: false },
        3.52,
      );

      // 3.83 — the lime ring lands on the Pix row (contracts onto it and settles)
      tl.fromTo(
        ring,
        { opacity: 0, scale: 1.035 },
        { opacity: 1, scale: 1, duration: 0.5, ease: 'power3.out' },
        3.83,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines['04-cardapio-preco-pix'] = tl;
    })();
