  <script>
    (function () {
      var P = '02-de-novo-';
      var root = document.querySelector('[data-composition-id="02-de-novo"]') || document;
      function all(name) {
        return Array.prototype.slice.call(root.getElementsByClassName(P + name));
      }
      function one(name, scope) {
        return (scope || root).getElementsByClassName(P + name)[0];
      }

      var DURATION = 5.859375;
      var HIT = 4.91; // "fila!"
      var F = 0.94; // Luiz's settled scale in the pile
      var K = 173 / 367; // slot height / frame-1 bubble height
      var LIFT = 259 - 638; // slot 0 top - handoff top
      var SNAP = 0.25;
      var SNAP_EASE = 'expo.out';

      // Frame-1 bubble parts, bubble-local [x, y, width] (measured from 01-o-audio.html at 8.35 s)
      // and their places on the 648x173 slot layout the new bubbles use.
      var BAR_X0 = 356.781;
      var BAR_STRIDE = 13.828;
      var SLOT_BAR_X0 = 195.202;
      var SLOT_BAR_STRIDE = 13.828;
      var PARTS = [
        ['avatar', [32.391, 124.75, 117.5], [32.4, 58.806, 55.388]],
        ['btn', [168.891, 99.047, 168.891], [101.688, 46.693, 79.613]],
        ['dur', [705.875, 145.906, 121.438], [532.753, 62.184, 78.547]],
        ['elapsed', [356.781, 291.297, 77.203], [SLOT_BAR_X0, 137.314, 36.393]],
        ['sender', [0, -98, 214.391], [0, -46.196, 101.062]],
      ];

      var tl = gsap.timeline({ paused: true });

      function flip(el, big, slot) {
        tl.fromTo(
          el,
          { x: 0, y: 0, scale: 1 },
          {
            x: F * slot[0] - big[0],
            y: LIFT + F * slot[1] - big[1],
            scale: (F * slot[2]) / big[2],
            duration: SNAP,
            ease: SNAP_EASE,
          },
          0,
        );
      }

      // Scene 1 (0-0.25 s, "Áudio de"): Luiz's bubble snaps into slot 0
      for (var i = 0; i < PARTS.length; i++) flip(one(PARTS[i][0]), PARTS[i][1], PARTS[i][2]);
      var bars = all('bar');
      for (var b = 0; b < bars.length; b++) {
        var h = parseFloat(bars[b].style.height);
        flip(
          bars[b],
          [BAR_X0 + BAR_STRIDE * b, 183.5 - h / 2, 11.891],
          [SLOT_BAR_X0 + SLOT_BAR_STRIDE * b, 86.5 - (h * K) / 2, 11.891 * K],
        );
      }
      // The shell reshapes 864x367 -> 648x173 with scaleX/scaleY only. Non-uniform scale
      // stretches corners, so three real-radius shells (handoff, mid-move, slot) ride the same
      // box and hand over at the move progress where their stretch is equal (~12% at worst).
      function shell(name, top, w, h) {
        tl.fromTo(
          one(name),
          { x: 0, y: 638 - top, scaleX: 864 / w, scaleY: 367 / h },
          {
            x: 0,
            y: 259 - top,
            scaleX: (F * 648) / w,
            scaleY: (F * 173) / h,
            duration: SNAP,
            ease: SNAP_EASE,
          },
          0,
        );
      }
      shell('shell-a', 638, 864, 367);
      shell('shell-m', 395.061, 700.622, 235.992);
      shell('shell-b', 259, 648, 173);
      // expo.out reaches progress p at SNAP * -log2(1 - p) / 10
      var HD = 0.02;
      function handover(from, to, p) {
        var at = (SNAP * -Math.log(1 - p)) / (10 * Math.LN2);
        tl.fromTo(
          one(to),
          { opacity: 0 },
          { opacity: 1, duration: HD, ease: 'none' },
          at - 0.7 * HD,
        );
        tl.fromTo(
          one(from),
          { opacity: 1 },
          { opacity: 0, duration: HD, ease: 'none', immediateRender: false },
          at - 0.3 * HD,
        );
      }
      handover('shell-a', 'shell-m', 0.366);
      handover('shell-m', 'shell-b', 0.847);
      // compact form: the name row and the elapsed counter give way as the note joins the pile
      tl.fromTo(
        one('sender'),
        { opacity: 1 },
        { opacity: 0, duration: 0.12, ease: 'power1.out' },
        0,
      );
      tl.fromTo(
        one('elapsed'),
        { opacity: 1 },
        { opacity: 0, duration: 0.1, ease: 'power1.out' },
        0,
      );
      var luiz = one('luiz');
      tl.fromTo(luiz, { rotation: 0 }, { rotation: -2, duration: SNAP, ease: SNAP_EASE }, 0);
      tl.fromTo(luiz, { opacity: 1 }, { opacity: 0.55, duration: SNAP, ease: 'power2.out' }, 0);

      // consecutive fromTo segments through fixed keys; none renders before its own start
      var pile = one('pile');
      var punch = one('punch');
      function chain(el, keys, steps, at) {
        var t = at;
        for (var k = 1; k < keys.length; k++) {
          var to = { duration: steps[k - 1], ease: k === 1 ? 'power2.out' : 'sine.inOut' };
          to.immediateRender = false;
          for (var key in keys[k]) to[key] = keys[k][key];
          tl.fromTo(el, Object.assign({}, keys[k - 1]), to, t);
          t += steps[k - 1];
        }
      }
      // Scene 2 (0.469-4.219 s): a note slams into its slot on every beat, each above the last;
      // its e2 lift fades to e1, the lime dot pops, the pile jolts toward the side it hit.
      var notes = all('nb');
      for (var n = 0; n < notes.length; n++) {
        var note = notes[n];
        var beat = parseFloat(note.getAttribute('data-beat'));
        var rot = parseFloat(note.getAttribute('data-rot'));
        var land = beat - 0.03;
        tl.fromTo(
          note,
          { y: -110, scale: 1.12, rotation: rot },
          { y: 0, scale: 1, rotation: rot, duration: 0.2, ease: 'expo.out' },
          land,
        );
        tl.fromTo(note, { opacity: 0 }, { opacity: 1, duration: 0.03, ease: 'none' }, land);
        tl.fromTo(
          one('bloom', note),
          { opacity: 1 },
          { opacity: 0, duration: 0.2, ease: 'power2.out' },
          land,
        );
        tl.fromTo(
          one('dot', note),
          { scale: 0 },
          { scale: 1, duration: 0.12, ease: 'power3.out' },
          beat + 0.05,
        );
        var s = rot > 0 ? 1 : -1;
        chain(
          pile,
          [
            { x: 0, y: 0 },
            { x: 3 * s, y: 4 },
            { x: -1.8 * s, y: -2.4 },
            { x: 0.6 * s, y: 1 },
            { x: 0, y: 0 },
          ],
          [0.03, 0.045, 0.045, 0.04],
          beat + 0.02,
        );
      }

      // Scene 3 (4.91 s, "fila!", the hit): hard decaying shake + punch to 1.04, settled by 5.31
      tl.fromTo(
        punch,
        { scale: 1 },
        { scale: 1.04, duration: 0.1, ease: 'power3.out', immediateRender: false },
        HIT,
      );
      tl.fromTo(
        punch,
        { scale: 1.04 },
        { scale: 1, duration: 0.3, ease: 'power2.out', immediateRender: false },
        HIT + 0.1,
      );
      chain(
        pile,
        [
          { x: 0, y: 0, rotation: 0 },
          { x: 14, y: 0, rotation: -0.8 },
          { x: -11, y: -3, rotation: 0.6 },
          { x: 8, y: 2, rotation: -0.45 },
          { x: -5, y: -1, rotation: 0.3 },
          { x: 2.5, y: 0.5, rotation: -0.15 },
          { x: -1, y: 0, rotation: 0.05 },
          { x: 0, y: 0, rotation: 0 },
        ],
        [0.03, 0.045, 0.045, 0.045, 0.045, 0.045, 0.045],
        HIT,
      );

      // Scene 4 (5.31-5.859 s): settled; the zoom-through takes it from 5.859
      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines['02-de-novo'] = tl;
    })();
  </script>
