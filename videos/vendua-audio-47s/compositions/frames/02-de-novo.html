  <script>
    (function () {
      var P = '02-de-novo-';
      var root = document.querySelector('[data-composition-id="02-de-novo"]') || document;
      function all(name) {
        return Array.prototype.slice.call(root.getElementsByClassName(P + name));
      }
      function one(name) {
        return root.getElementsByClassName(P + name)[0];
      }

      var DURATION = 7.4;
      var F = 0.94; // Luiz's settled scale in the pile
      var K = 173 / 367; // slot height / frame-1 bubble height
      var LIFT = 259 - 638; // slot 1 top - handoff top

      // Frame-1 bubble parts, bubble-local [x, y, width] (measured from 01-o-audio.html at 8.35 s)
      // and their places on the 648x173 slot layout the new bubbles use.
      var BAR_X0 = 356.781;
      var BAR_STRIDE = 13.828;
      var SLOT_BAR_X0 = 195.202;
      var SLOT_BAR_STRIDE = 13.828;
      var PARTS = [
        ['avatar', [32.391, 124.75, 117.5], [32.4, 58.806, 55.388]],
        ['btn', [168.891, 99.047, 168.891], [101.688, 46.693, 79.613]],
        ['dur', [705.875, 145.906, 121.438], [532.753, 62.184, 78.547]],
        ['elapsed', [356.781, 291.297, 77.203], [SLOT_BAR_X0, 137.314, 36.393]],
        ['sender', [0, -98, 214.391], [0, -46.196, 101.062]],
      ];

      // Scene 1 ease: a critically damped spring released from rest, so the bubble leaves
      // frame 1's still pose with zero velocity and settles on a long tail (no overshoot).
      var MOVE = 0.9;
      var OMEGA = 8.5;
      var SPRING_END = 1 - (1 + OMEGA * MOVE) * Math.exp(-OMEGA * MOVE);
      function settle(p) {
        if (p >= 1) return 1;
        var t = p * MOVE;
        return (1 - (1 + OMEGA * t) * Math.exp(-OMEGA * t)) / SPRING_END;
      }

      var tl = gsap.timeline({ paused: true });

      function flip(el, big, slot) {
        tl.fromTo(
          el,
          { x: 0, y: 0, scale: 1 },
          {
            x: F * slot[0] - big[0],
            y: LIFT + F * slot[1] - big[1],
            scale: (F * slot[2]) / big[2],
            duration: MOVE,
            ease: settle,
          },
          0,
        );
      }

      // Scene 1 (0-0.66 s, "Audio de"): Luiz's bubble shrinks and lifts into slot 1
      for (var i = 0; i < PARTS.length; i++) flip(one(PARTS[i][0]), PARTS[i][1], PARTS[i][2]);
      var bars = all('bar');
      for (var b = 0; b < bars.length; b++) {
        var h = parseFloat(bars[b].style.height);
        flip(
          bars[b],
          [BAR_X0 + BAR_STRIDE * b, 183.5 - h / 2, 11.891],
          [SLOT_BAR_X0 + SLOT_BAR_STRIDE * b, 86.5 - (h * K) / 2, 11.891 * K],
        );
      }
      // The shell reshapes 864x367 -> 648x173 with scaleX/scaleY only. Non-uniform scale
      // stretches corners, so three real-radius shells (handoff, mid-move, slot) ride the same
      // box and hand over where their stretch is equal (~12% at worst).
      function shell(name, top, w, h) {
        tl.fromTo(
          one(name),
          { x: 0, y: 638 - top, scaleX: 864 / w, scaleY: 367 / h },
          {
            x: 0,
            y: 259 - top,
            scaleX: (F * 648) / w,
            scaleY: (F * 173) / h,
            duration: MOVE,
            ease: settle,
          },
          0,
        );
      }
      shell('shell-a', 638, 864, 367);
      shell('shell-m', 395.061, 700.622, 235.992);
      shell('shell-b', 259, 648, 173);
      function handover(from, to, at) {
        tl.fromTo(
          one(to),
          { opacity: 0 },
          { opacity: 1, duration: 0.1, ease: 'power1.inOut' },
          at - 0.07,
        );
        tl.fromTo(
          one(from),
          { opacity: 1 },
          { opacity: 0, duration: 0.1, ease: 'power1.inOut', immediateRender: false },
          at - 0.03,
        );
      }
      handover('shell-a', 'shell-m', 0.15);
      handover('shell-m', 'shell-b', 0.39);
      // compact form: the name row and the elapsed counter give way as the note joins the pile
      tl.fromTo(
        one('sender'),
        { opacity: 1 },
        { opacity: 0, duration: 0.3, ease: 'power1.out' },
        0.02,
      );
      tl.fromTo(
        one('elapsed'),
        { opacity: 1 },
        { opacity: 0, duration: 0.24, ease: 'power1.out' },
        0.02,
      );
      tl.fromTo(
        one('luiz'),
        { opacity: 1 },
        { opacity: 0.55, duration: 0.6, ease: 'power2.inOut' },
        0.15,
      );

      // Scenes 2-5: each new voice note drops into its slot on its word ("47", "Enquanto",
      // "forno", "fila") — smooth spring-pop (power3.out, no overshoot), lifted shadow e2
      // blooming down to e1, then the lime new-dot.
      var notes = all('nb');
      for (var n = 0; n < notes.length; n++) {
        var at = parseFloat(notes[n].getAttribute('data-cue')) - 0.03;
        tl.fromTo(
          notes[n],
          { scale: 0, y: -32 },
          { scale: 1, y: 0, duration: 0.45, ease: 'power3.out' },
          at,
        );
        tl.fromTo(notes[n], { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power2.out' }, at);
        tl.fromTo(
          notes[n].getElementsByClassName(P + 'bloom')[0],
          { opacity: 1 },
          { opacity: 0, duration: 0.45, ease: 'power2.inOut' },
          at + 0.15,
        );
        tl.fromTo(
          notes[n].getElementsByClassName(P + 'dot')[0],
          { scale: 0 },
          { scale: 1, duration: 0.36, ease: 'power3.out' },
          at + 0.12,
        );
      }

      // Scene 6 (6.9-7.4 s): hold, still
      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines['02-de-novo'] = tl;
    })();
