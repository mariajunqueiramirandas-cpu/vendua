<template>
  <style>
    @font-face {
      font-family: 'Space Grotesk';
      src: url('assets/fonts/space-grotesk.woff2') format('woff2');
      font-weight: 300 700;
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #f02-bg {
      position: absolute;
      inset: 0;
      background: #123c32;
    }
    #f02-stage {
      position: absolute;
      inset: 0;
    }
    #f02-stack {
      position: absolute;
      left: 90px;
      top: 612px;
      width: 900px;
      transform-origin: 0% 50%;
      font:
        700 150px/1 'Space Grotesk',
        sans-serif;
      letter-spacing: -0.045em;
      color: #f7f4ea;
    }
    .f02-line {
      display: block;
      height: 176px;
      margin-bottom: -22px;
      padding-top: 8px;
      overflow: hidden;
    }
    .f02-word {
      display: block;
      white-space: nowrap;
    }
    #f02-panel {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #fff6ea, #fde7d4);
    }
  </style>

  <div id="root" data-composition-id="f02-o-dia" data-width="1080" data-height="1920">
    <div id="f02-bg" class="clip" data-start="0" data-duration="3" data-track-index="0"></div>
    <div id="f02-stage" class="clip" data-start="0" data-duration="3" data-track-index="1">
      <div id="f02-stack">
        <span class="f02-line"><span class="f02-word" id="f02-w1">Pedidos.</span></span>
        <span class="f02-line"><span class="f02-word" id="f02-w2">Cardápio.</span></span>
        <span class="f02-line"><span class="f02-word" id="f02-w3">Horários.</span></span>
        <span class="f02-line"><span class="f02-word" id="f02-w4">Pix.</span></span>
      </div>
      <div id="f02-panel"></div>
    </div>
  </div>

  <script>
    (() => {
      // cues (scene-local): a word per beat 0 / 0.5 / 1.0 / 1.5, the stab on 2.0, the whip on 2.5
      const WORDS = [0, 0.5, 1, 1.5];
      const LIME = '#d9f875';
      const CREAM = '#f7f4ea';
      const tl = gsap.timeline({ paused: true });

      WORDS.forEach((t, k) => {
        const id = `#f02-w${k + 1}`;
        tl.fromTo(
          id,
          { yPercent: 115, color: LIME },
          { yPercent: 0, color: LIME, duration: 0.32, ease: 'expo.out' },
          Math.max(0, t - 0.05),
        );
        // it settles to cream as the next word lands; the last stays lime
        if (k < WORDS.length - 1)
          tl.to(id, { color: CREAM, duration: 0.18, ease: 'power1.out' }, WORDS[k + 1]);
      });
      // the stack bumps a little with every landing
      WORDS.forEach((t) =>
        tl.fromTo(
          '#f02-stack',
          { x: -6 },
          { x: 0, duration: 0.3, ease: 'power3.out', immediateRender: false },
          t,
        ),
      );

      // the stab
      tl.fromTo(
        '#f02-stack',
        { scale: 1.045 },
        { scale: 1, duration: 0.4, ease: 'back.out(2)', immediateRender: false },
        2,
      );

      // the whip: the stack flies up and out while the cream sky rises in behind the whoosh
      tl.to(
        '#f02-stack',
        { y: -1500, filter: 'blur(14px)', duration: 0.38, ease: 'power3.in' },
        2.52,
      );
      tl.fromTo(
        '#f02-panel',
        { yPercent: 100 },
        { yPercent: 0, duration: 0.42, ease: 'power3.in' },
        2.56,
      );

      window.__timelines['f02-o-dia'] = tl;
    })();
  </script>
</template>
