      const PUSH = 1.5;
      const tl = gsap.timeline({ paused: true });

      tl.fromTo('#f03-l1', { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: 'expo.out' }, 0);

      // the phone swings up out of the bottom, tilted back, and turns to face us

        '#f03-phone',
        {
          y: 1300,
          rotationX: 58,
          rotationY: -26,
          rotationZ: 9,
          scale: 0.86,

          rotationY: -9,
          rotationZ: 0,
          scale: 1,
          duration: 0.72,

        0.26,

      // the screen wakes on the beat: black lifts, the UI settles in, a sheen crosses the glass
      tl.to('#f03-off', { opacity: 0, duration: 0.2, ease: 'power2.out' }, WAKE);
      tl.fromTo(
        '#f03-ui',
        { scale: 1.08, opacity: 0.4 },

        WAKE,

        { x: 760, opacity: 1, duration: 0.6, ease: 'power2.inOut' },
        WAKE + 0.04,

      tl.fromTo(
        '#f03-body',
        { scale: 1.035 },
        { scale: 1, duration: 0.5, ease: 'elastic.out(1, 0.5)' },
        WAKE,
      );
      tl.fromTo(
        '#f03-glow',
        { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.5, ease: 'power2.out' },
        WAKE,
      );
      tl.to('#f03-glow', { opacity: 0.55, duration: 0.5, ease: 'power1.inOut' }, WAKE + 0.5);
      // it turns fully square to camera and floats
