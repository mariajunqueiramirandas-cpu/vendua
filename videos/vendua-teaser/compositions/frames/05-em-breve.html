  <script>
    (() => {
      // cues (scene-local): the finale hit on 0 (flash, pill pops, sparkle); the Instagram row lands on
      // the first chime at 0.5, the website row on the second at 0.75; everything holds to the end
      const IG = 0.5;
      const WEB = 0.75;
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        '#f05-flash',
        { opacity: 0.95 },
        { opacity: 0, duration: 0.32, ease: 'power2.out' },
        0,
      );
      tl.fromTo(
        '#f05-pill',
        { scale: 0.2 },
        { scale: 1, duration: 0.55, ease: 'back.out(2.4)' },
        0,
      );
      tl.fromTo('#f05-shine', { x: -140 }, { x: 560, duration: 0.55, ease: 'power2.inOut' }, 0.18);
      tl.fromTo(
        '#f05-path',
        { strokeDashoffset: 118 },
        { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out' },
        0.02,
      );
      tl.fromTo('#f05-v', { scale: 0.6 }, { scale: 1, duration: 0.5, ease: 'back.out(2)' }, 0.02);
      tl.fromTo(
        '.f05-l',
        { yPercent: 105 },
        { yPercent: 0, duration: 0.6, ease: 'elastic.out(1, 0.55)', stagger: 0.035 },
        0.04,
      );
      tl.fromTo(
        '.f05-spark',
        { y: 0, opacity: 1, scale: 1 },
        { y: -260, opacity: 0, scale: 0.3, duration: 0.8, ease: 'power2.out', stagger: 0.05 },
        0.03,
      );

      // the two rows land on their chimes, icon first
      for (const [row, icon, t] of [
        ['#f05-ig', '#f05-ig-icon', IG],
        ['#f05-web', '#f05-web-icon', WEB],
      ]) {
        tl.fromTo(
          row,
          { y: 50, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' },
          t - 0.06,
        );
        tl.fromTo(
          icon,
          { scale: 0.3, rotation: -25 },
          { scale: 1, rotation: 0, duration: 0.55, ease: 'back.out(3)' },
          t,
        );
      }
      // a nudge on the Instagram icon once both are in, so the eye goes there last
      tl.to(
        '#f05-ig-icon',
        { keyframes: { scale: [1, 1.14, 1] }, duration: 0.4, ease: 'sine.inOut' },
        1.5,
      );

      // hold, drifting in; the music fades, the frame stays readable to the last frame
      tl.fromTo(
        '#f05-group',
        { scale: 1 },
        { scale: 1.03, duration: 2.7, ease: 'sine.inOut' },
        0.3,
      );

      window.__timelines['f05-em-breve'] = tl;
    })();
