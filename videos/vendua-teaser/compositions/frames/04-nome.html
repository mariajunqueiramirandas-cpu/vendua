<template>
  <style>
    @font-face {
      font-family: 'Space Grotesk';
      src: url('assets/fonts/space-grotesk.woff2') format('woff2');
      font-weight: 300 700;
    }
    @font-face {
      font-family: 'Figtree';
      src: url('assets/fonts/figtree.woff2') format('woff2');
      font-weight: 300 900;
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #f04-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #fff6ea, #fde7d4);
    }
    #f04-stage {
      position: absolute;
      inset: 0;
    }
    #f04-name {
      position: absolute;
      left: 0;
      top: 432px;
      width: 1080px;
      display: flex;
      justify-content: center;
    }
    #f04-word {
      position: relative;
      isolation: isolate;
      margin-left: -32px;
      font:
        700 250px/0.8 'Space Grotesk',
        sans-serif;
      letter-spacing: -0.06em;
      color: #123c32;
      white-space: nowrap;
      padding-top: 1.2em;
      /* letters rise from under the baseline: only the bottom edge clips */
      clip-path: inset(-2em -1em 0 -1em);
    }
    .f04-l {
      position: relative;
      display: inline-block;
    }
    #f04-acute {
      position: absolute;
      left: 0.24em;
      top: 0.01em;
      width: 0.1em;
      height: 0.2em;
    }
    #f04-acute i {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 0.05em;
      background: #123c32;
      rotate: 38deg;
    }
    /* Duá stands behind the letters; the box's bottom edge sits at the top of the lowercase */
    #f04-peek {
      position: absolute;
      z-index: -1;
      left: 1.02em;
      bottom: 0.56em;
      width: 2.1em;
      height: 1.7em;
      overflow: clip;
      mask-image: linear-gradient(to top, transparent 0.02em, rgb(0 0 0 / 0.4) 0.16em, #000 0.43em);
    }
    #f04-dua {
      position: absolute;
      left: 0.28em;

      transform-origin: 50% 100%;
    }
    #f04-dua img {
      display: block;
      width: 100%;
      height: 100%;
    }
    #f04-ring {
      position: absolute;
      left: 0;
      top: 0;
      width: 360px;

      margin: -180px 0 0 -180px;

      border: 6px solid #d9f875;

    #f04-tag {
      position: absolute;

      font:
        500 52px/1.28 'Figtree',
        sans-serif;
      color: #4f6a5e;
    }
    .f04-w {
      display: inline-block;
    }
  </style>

  <div id="root" data-composition-id="f04-nome" data-width="1080" data-height="1920">
    <div id="f04-bg" class="clip" data-start="0" data-duration="4" data-track-index="0"></div>
    <div id="f04-stage" class="clip" data-start="0" data-duration="4" data-track-index="1">
      <div id="f04-name">
        <span id="f04-word"
          ><span id="f04-peek"
            ><span id="f04-dua"><img src="assets/dua-ola.webp" alt="" /></span></span
          ><span class="f04-l" id="f04-l1">v</span><span class="f04-l" id="f04-l2">e</span
          ><span class="f04-l" id="f04-l3">n</span><span class="f04-l" id="f04-l4">d</span
          ><span class="f04-l" id="f04-l5">u</span
          ><span class="f04-l" id="f04-l6"
            >a<span id="f04-acute"><i></i></span></span
          ><span class="f04-l" id="f04-dot">.</span></span
        >
      </div>
      <div id="f04-ring"></div>
      <p id="f04-tag">
        <span class="f04-w">Para</span> <span class="f04-w">doceiras,</span>
        <span class="f04-w">marmitarias,</span> <span class="f04-w">hamburguerias</span>
        <span class="f04-w">e</span> <span class="f04-w">padarias.</span>
      </p>
    </div>
  </div>

  <script>
    (() => {
      // cues (scene-local): letters on the eighths 0 → 1.25 (the drop is 0), the accent 1.5, the dot 2.0,
      // Duá climbs 2.05 → 2.7 and waves on 2.75 and 3.0, the line arrives 2.5 → 3.5
      const LETTERS = [0, 0.25, 0.5, 0.75, 1, 1.25];
      const ACCENT = 1.5;
      const DOT = 2;
      const tl = gsap.timeline({ paused: true });

      LETTERS.forEach((t, k) =>
        tl.fromTo(
          `#f04-l${k + 1}`,
          { yPercent: 105 },
          { yPercent: 0, duration: 0.7, ease: 'elastic.out(1, 0.5)' },
          Math.max(0, t - 0.04),
        ),
      );
      tl.fromTo(
        '#f04-acute',
        { y: -260, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.24, ease: 'power3.in' },
        ACCENT - 0.24,
      );
      tl.fromTo(
        '#f04-acute',
        { scale: 1.5 },
        { scale: 1, duration: 0.4, ease: 'back.out(3)', immediateRender: false },
        ACCENT,
      );

      // the dot drops in hard on the beat and squashes
      tl.set('#f04-dot', { opacity: 0 }, 0);
      tl.set('#f04-dot', { opacity: 1 }, DOT - 0.3);
      tl.fromTo('#f04-dot', { y: -820 }, { y: 0, duration: 0.3, ease: 'power3.in' }, DOT - 0.3);
      tl.fromTo(
        '#f04-dot',
        { scaleX: 1.35, scaleY: 0.6, transformOrigin: '50% 100%' },
        {
          scaleX: 1,
          scaleY: 1,
          duration: 0.5,
          ease: 'elastic.out(1, 0.4)',
          immediateRender: false,
        },
        DOT,
      );
      tl.fromTo(
        '#f04-word',
        { y: 12 },
        { y: 0, duration: 0.45, ease: 'elastic.out(1, 0.45)', immediateRender: false },
        DOT,
      );
      tl.set('#f04-ring', { x: 948, y: 900 }, 0);
      tl.fromTo(
        '#f04-ring',
        { scale: 0.2, opacity: 1 },
        { scale: 2.2, opacity: 0, duration: 0.7, ease: 'power3.out', immediateRender: false },
        DOT,
      );

      // Duá climbs out from behind the name and waves
      tl.fromTo(
        '#f04-dua',
        { yPercent: 100 },
        { yPercent: 0, duration: 0.65, ease: 'back.out(1.5)' },
        DOT + 0.05,
      );
      tl.to(
        '#f04-dua',
        { keyframes: { rotation: [0, -7, 6, 0] }, duration: 0.25, ease: 'sine.inOut' },
        2.75,
      );
      tl.to(
        '#f04-dua',
        { keyframes: { rotation: [0, -6, 5, 0] }, duration: 0.25, ease: 'sine.inOut' },
        3,
      );
      tl.to('#f04-dua', { y: -10, duration: 0.7, ease: 'sine.inOut' }, 3.3);

      // the line, word by word
      tl.fromTo(
        '.f04-w',
        { y: 36, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out', stagger: 0.2 },
        2.5,
      );

      // a slow lean in to the cut
      tl.fromTo('#f04-name', { scale: 1 }, { scale: 1.035, duration: 1.8, ease: 'sine.in' }, 2.2);

      window.__timelines['f04-nome'] = tl;
    })();
  </script>
</template>
