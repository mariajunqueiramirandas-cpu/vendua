<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #123c32;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-f01-faisca"
        class="scene"
        data-composition-id="f01-faisca"
        data-composition-src="compositions/frames/01-faisca.html"
        data-start="0"
        data-duration="2"
        data-track-index="1"
      ></div>
      <div
        id="el-f02-o-dia"
        class="scene"
        data-composition-id="f02-o-dia"
        data-composition-src="compositions/frames/02-o-dia.html"
        data-start="2"
        data-duration="3"
        data-track-index="1"
      ></div>
      <div
        id="el-f03-palma"
        class="scene"
        data-composition-id="f03-palma"
        data-composition-src="compositions/frames/03-palma.html"
        data-start="5"
        data-duration="3"
        data-track-index="1"
      ></div>
      <div
        id="el-f04-nome"
        class="scene"
        data-composition-id="f04-nome"
        data-composition-src="compositions/frames/04-nome.html"
        data-start="8"
        data-duration="4"
        data-track-index="1"
      ></div>
      <div
        id="el-f05-em-breve"
        class="scene"
        data-composition-id="f05-em-breve"
        data-composition-src="compositions/frames/05-em-breve.html"
        data-start="12"
        data-duration="3"
        data-track-index="1"
      ></div>

      <!-- the synthesized score + sound effects, one premixed track (audio/synth.mjs, audio/cues.json) -->
      <audio
        id="el-score"
        src="audio/score.wav"
        data-start="0"
        data-duration="15"
        data-track-index="11"
        data-volume="1"
      ></audio>
    </div>

    <script>
      window.__timelines['main'] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
