  </style>

  <div
    id="root"
    data-composition-id="03-assumir"

    <div
      class="03-assumir-stage clip"
      data-start="0"
      data-duration="4"

    >
      <div class="03-assumir-punch" data-layout-allow-overflow>
        <div class="03-assumir-devcam" data-layout-allow-overflow>
          <div class="03-assumir-phone">
            <div class="03-assumir-screen">

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var NS = '03-assumir';
      var DURATION = 3.75;
      var root = document.querySelector('[data-composition-id="' + NS + '"]');
      var part = function (name) {
        return root.getElementsByClassName(NS + '-' + name)[0];
      };

      var punch = part('punch');
      var devcam = part('devcam');
      var l6 = part('l6');
      var l7 = part('l7');
      var patch = part('patch');
      var glow = part('glow');
      var btn = part('btn');
      var scrim = part('scrim');
      var ring = part('ring');
      var chipwrap = part('chipwrap');
      var chipbloom = part('chipbloom');

      // The floor bar spans the full screen width, so an in-screen zoom can't hold both
      // "O Duá está atendendo" and "assumir"; the camera pushes the whole device instead.
      // Screen origin 302.9, 385.9 (PHONE box + 13.9 padding); 1 capture px = 0.5416 css px.
      var K = 406.2 / 750;
      var SX = 302.9;
      var SY = 385.9;
      var FX = 506; // framed point lands here (centre of the x 72–940 column)
      var FY = 800;
      // camera that puts capture point (375, ty) at F at scale s
      var cam = function (s, ty) {
        return { scale: s, x: FX - s * (SX + 375 * K), y: FY - s * (SY + ty * K) };
      };
      var HOME = { scale: 1, x: 0, y: 0 };
      var PUSH = cam(1.8, 1330); // floor bar of 6: content x 28–724, y 1258–1437
      var DRIFT = cam(1.84, 1330);
      var HOLD7 = cam(1.86, 1316); // floor of 7: content y 1185–1442
      var OUT = cam(1.2, 1316);

      // tap ring at "assumir"'s measured centre (604.5, 1307.5) under the DRIFT camera
      var RX = FX + 1.84 * K * (604.5 - 375);
      var RY = FY + 1.84 * K * (1307.5 - 1330);
      ring.style.left = RX - 36 + 'px';
      ring.style.top = RY - 36 + 'px';
      var RS = 1.84; // the ring rides the camera's magnification

      var tl = gsap.timeline({ paused: true });
      // an element's first tween renders its from-state at build time (the t=0 frame);
      // later ones wait for the playhead. The ring stays CSS-hidden until its tap.
      var seen = [ring];
      var from = function (el, a, b, dur, ease, at) {
        b.duration = dur;
        b.ease = ease;
        b.immediateRender = seen.indexOf(el) < 0;
        seen.push(el);
        tl.fromTo(el, a, b, at);
      };

      // Scene 1 — "Precisou" 0.08: thread scrolls to the top, camera slams onto the floor bar
      // two text-heavy screens must not read on top of each other: the swap is a 2-frame cut
      // with the slide carried on y alone
      from(l6, { opacity: 0 }, { opacity: 1 }, 0.06, 'none', 0.08);
      tl.fromTo(l6, { y: -28 }, { y: 0, duration: 0.2, ease: 'expo.out', immediateRender: false }, 0.08);
      from(devcam, HOME, Object.assign({}, PUSH), 0.3, 'expo.out', 0.2);
      from(scrim, { opacity: 0 }, { opacity: 1 }, 0.26, 'power2.out', 0.22);
      from(devcam, Object.assign({}, PUSH), Object.assign({}, DRIFT), 0.8, 'sine.inOut', 0.5);

      // "Um" 1.22: the button lifts; "toque," 1.38: ring + press
      from(btn, { scale: 1 }, { scale: 1.04 }, 0.14, 'power2.out', 1.22);
      from(patch, { opacity: 0 }, { opacity: 1 }, 0.01, 'none', 1.36);
      from(btn, { scale: 1.04 }, { scale: 0.94 }, 0.08, 'power1.in', 1.36);
      from(btn, { scale: 0.94 }, { scale: 1 }, 0.14, 'power3.out', 1.44);
      from(ring, { scale: 0.4 * RS, opacity: 1 }, { scale: 1.5 * RS, opacity: 0 }, 0.35, 'power2.out', 1.36);
      from(glow, { scale: 0.85, opacity: 0 }, { scale: 1.2, opacity: 0.85 }, 0.12, 'power2.out', 1.44);
      from(glow, { scale: 1.2, opacity: 0.85 }, { scale: 1.3, opacity: 0 }, 0.2, 'power2.in', 1.56);

      // Scene 3 — 1.6: "Você está atendendo", composer open; the camera holds the floor
      from(l7, { opacity: 0 }, { opacity: 1 }, 0.06, 'none', 1.6);
      tl.fromTo(l7, { y: 28 }, { y: 0, duration: 0.2, ease: 'expo.out', immediateRender: false }, 1.6);
      from(devcam, Object.assign({}, DRIFT), Object.assign({}, HOLD7), 0.62, 'sine.inOut', 1.62);

      // "assume" 2.28: punch
      from(punch, { scale: 1 }, { scale: 1.05 }, 0.1, 'power2.out', 2.26);
      from(punch, { scale: 1.05 }, { scale: 1 }, 0.25, 'power2.out', 2.36);

      // "conversa." 2.72: spark-chip drops in by the phone's corner
      from(
        chipwrap,
        { opacity: 0, scale: 1.12, y: -70 },
        { opacity: 1, scale: 1, y: 0 },
        0.24,
        'expo.out',
        2.7,
      );
      from(chipbloom, { opacity: 1 }, { opacity: 0 }, 0.24, 'expo.out', 2.7);

      // into the cut: camera eases out to 1.2x
      from(devcam, Object.assign({}, HOLD7), Object.assign({}, OUT), 0.8, 'power2.in', 2.95);

      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines[NS] = tl;
    })();
  </script>
