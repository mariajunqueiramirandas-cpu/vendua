<!doctype html>
<!-- Not a crawl: the brand faces the site ships (@fontsource packages in site/package.json), declared so build-frame stages them into assets/fonts. -->
<html>
  <head>
    <style>
      @font-face {
        font-family: 'Space Grotesk Variable';
        font-style: normal;
        font-display: block;
        font-weight: 300 700;
        src: url('assets/fonts/space-grotesk-latin-wght-normal.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Figtree Variable';
        font-style: normal;
        font-display: block;
        font-weight: 300 900;
        src: url('assets/fonts/figtree-latin-wght-normal.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: normal;
        font-display: block;
        font-weight: 400;
        src: url('assets/fonts/instrument-serif-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: italic;
        font-display: block;
        font-weight: 400;
        src: url('assets/fonts/instrument-serif-latin-400-italic.woff2') format('woff2');
      }
    </style>
  </head>
  <body></body>
</html>
