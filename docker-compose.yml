# Dokploy compose (docs: deploy/dokploy.md). `core` is internal-only — the storefront edge
# proxies /storefront/v1, /checkout/v1, /v1 to it, forwarding Host for tenant routing.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vendua
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vendua
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vendua -d vendua']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  core:
    build:
      context: .
      dockerfile: packages/core/Dockerfile
    environment:
      PORT: '8787'
      DATABASE_URL: postgres://vendua_app:${VENDUA_APP_DB_PASSWORD:?set VENDUA_APP_DB_PASSWORD in .env}@db:5432/vendua
      MIGRATION_DATABASE_URL: postgres://vendua:${POSTGRES_PASSWORD}@db:5432/vendua
      VENDUA_APP_DB_PASSWORD: ${VENDUA_APP_DB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # Staff login key for the CRM at /control/ (the login page's "key").
      CONTROL_SECRET: ${CONTROL_SECRET:?set CONTROL_SECRET in .env}
      # Traefik fronts everything — X-Forwarded-* carries routing truth.
      VENDUA_TRUST_PROXY: '1'
      # Chain is client → Traefik → edge/nginx → core; trust that proxy's append (1 hop from the right).
      VENDUA_PROXY_HOPS: ${VENDUA_PROXY_HOPS:-1}
      # Control Plane (docs/architecture/08): the edge's key for /edge/v1/resolve — same value below.
      VENDUA_EDGE_SECRET: ${VENDUA_EDGE_SECRET:?set VENDUA_EDGE_SECRET in .env}
      # Synthetic probes verify deployments and watch every live host (default on in production).
      VENDUA_PROBES: ${VENDUA_PROBES:-1}
      # unset = probe https://<host> (DNS + TLS + edge); http://edge:8080 = through the edge only
      VENDUA_PROBE_ORIGIN: ${VENDUA_PROBE_ORIGIN:-}
      # Merchant admin: stores live at <slug>.<VENDUA_STORE_DOMAIN>.
      VENDUA_STORE_DOMAIN: ${VENDUA_STORE_DOMAIN:-vendua.com.br}
      # The admin's own domain (the `admin` service's); set, no other host serves /admin.
      VENDUA_ADMIN_HOST: ${VENDUA_ADMIN_HOST:-}
      # Web push for new orders (npx web-push generate-vapid-keys); unset = push off, sound still on.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:suporte@vendua.com.br}
      # Ajuda's "chamar no WhatsApp" number (digits); unset = in-app message only.
      VENDUA_SUPPORT_WHATSAPP: ${VENDUA_SUPPORT_WHATSAPP:-}
      # Mercado Pago (docs/deploy/dokploy.md): stores connect by OAuth to this application;
      # unset = stores keep the offline methods. The platform token bills plans (signup needs it).
      MP_CLIENT_ID: ${MP_CLIENT_ID:-}
      MP_CLIENT_SECRET: ${MP_CLIENT_SECRET:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_PLATFORM_ACCESS_TOKEN: ${MP_PLATFORM_ACCESS_TOKEN:-}
      # the payer email MP requires on Pix (shoppers don't give one); unset = pagador@<store domain>
      MP_PAYER_EMAIL: ${MP_PAYER_EMAIL:-}
      # Seals stores' MP tokens at rest (optional); unset = derived from SESSION_SECRET (warns at
      # boot). Setting it later is safe: tokens sealed under the derived key still open.
      VENDUA_SECRETS_KEY: ${VENDUA_SECRETS_KEY:-}
      # 1 = on each boot, create the quero-pudim store (+ its owner, CRM record) if missing.
      # Production only adds: an existing store keeps everything; it just gains new SEED_DOMAINS.
      SEED_DEMO: ${SEED_DEMO:-0}
      # slug:public-host[,slug:host2] — registers each storefront's real domain at seed time.
      SEED_DOMAINS: ${SEED_DOMAINS:-}
      # the seeded store's owner in the merchant admin (only used when the seed creates it)
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-}
      SEED_OWNER_PHONE: ${SEED_OWNER_PHONE:-}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-}
      # Driver reads the key its Config row's secret_ref names; unset = driver reports "ausente".
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Svix signing secret for the inbound email webhook; unset = inbound events rejected.
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      TINYFISH_API_KEY: ${TINYFISH_API_KEY:-}
      VENDUA_WEBHOOK_SECRET: ${VENDUA_WEBHOOK_SECRET:-}
      # monid.ai gateway for the agent's paid enrichment tools — read directly; unset = tools report missing.
      MONID_API_KEY: ${MONID_API_KEY:-}
      # Meeting integrations (optional): B64 SA key for deploy, plain JSON for dev; unset = gcal off, static roomUrl.
      GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON_B64: ${GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON_B64:-}
      GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON: ${GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      DAILY_API_KEY: ${DAILY_API_KEY:-}
      # Instagram DMs via the ig-sidecar service below; the same secret signs both directions.
      IG_SIDECAR_URL: http://ig-sidecar:8790
      IG_SIDECAR_SECRET: ${IG_SIDECAR_SECRET:-}
      # pino level for core itself / the Baileys socket logger.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BAILEYS_LOG_LEVEL: ${BAILEYS_LOG_LEVEL:-warn}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bun -e "fetch(''http://127.0.0.1:8787/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # Every store, one service (docs/architecture/07): the edge maps Host → store → release through
  # Core, serves that release's immutable files from the artifact store and injects vendua-state.
  # New stores and releases need no compose change; only a PRO+ store's own domain is added in
  # Dokploy's Domains UI (service edge, port 8080) — see docs/deploy/dokploy.md.
  edge:
    build:
      context: .
      dockerfile: packages/edge/Dockerfile
    environment:
      VENDUA_CORE_URL: http://core:8787
      VENDUA_EDGE_SECRET: ${VENDUA_EDGE_SECRET}
      # file:///… = the `artifacts` volume `publish` writes; s3://bucket/prefix = R2/MinIO (S3_* below)
      VENDUA_ARTIFACTS: ${VENDUA_ARTIFACTS:-file:///var/lib/vendua/artifacts}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
    volumes:
      - artifacts:/var/lib/vendua/artifacts:ro
      # route/state snapshot + verified files: a restart during a Core outage keeps serving
      - edgecache:/var/cache/vendua-edge
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bun -e "fetch(''http://127.0.0.1:8080/_edge/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    # Dokploy's Domains form rejects wildcards, so the route lives here. Priority 1 = last:
    # exact hosts set in the Domains UI (admin, crm, site) always win over the wildcard.
    networks: [default, dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.vendua-edge.loadbalancer.server.port=8080
      - traefik.http.routers.vendua-edge-http.rule=HostRegexp(`^[a-z0-9-]+\.vendua\.com\.br$$`)
      - traefik.http.routers.vendua-edge-http.entrypoints=web
      - traefik.http.routers.vendua-edge-http.priority=1
      - traefik.http.routers.vendua-edge-http.middlewares=vendua-edge-https
      - traefik.http.middlewares.vendua-edge-https.redirectscheme.scheme=https
      - traefik.http.routers.vendua-edge.rule=HostRegexp(`^[a-z0-9-]+\.vendua\.com\.br$$`)
      - traefik.http.routers.vendua-edge.entrypoints=websecure
      - traefik.http.routers.vendua-edge.priority=1
      - traefik.http.routers.vendua-edge.tls=true
      - traefik.http.routers.vendua-edge.service=vendua-edge
      - traefik.http.routers.vendua-edge-http.service=vendua-edge
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # One-shot per deploy: every storefront's build becomes a release in the artifact store and is
  # registered with the Control Plane, which promotes it where each store's policy says.
  # Unchanged storefronts hash to the release they already have, so a redeploy changes nothing.
  publish:
    build:
      context: .
      dockerfile: storefronts/Dockerfile
      target: publish
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    environment:
      VENDUA_CORE_ORIGIN: http://core:8787
      CONTROL_SECRET: ${CONTROL_SECRET}
      VENDUA_ARTIFACTS: ${VENDUA_ARTIFACTS:-file:///var/lib/vendua/artifacts}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
    volumes:
      - artifacts:/var/lib/vendua/artifacts
    depends_on:
      core:
        condition: service_healthy
    restart: 'no'
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # Instagram DM transport (services/ig-sidecar, Go + mautrix-meta, AGPL-3.0). Internal
  # only: Core pushes the stored session in and it posts signed events back. Without
  # IG_SIDECAR_SECRET it idles and refuses every call.
  ig-sidecar:
    build:
      context: ./services/ig-sidecar
    environment:
      IG_SIDECAR_SECRET: ${IG_SIDECAR_SECRET:-}
      CORE_EVENTS_URL: http://core:8787/control/v1/ig/events
      # static residential proxy (http:// or socks5://) — Instagram flags datacenter IPs
      IG_PROXY: ${IG_PROXY:-}
      IG_MIN_SEND_GAP_SECONDS: ${IG_MIN_SEND_GAP_SECONDS:-20}
      LOG_LEVEL: ${IG_SIDECAR_LOG_LEVEL:-info}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8790/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # Staff CRM — attach the staff domain here, never on core (shortens the proxy
  # chain and breaks VENDUA_PROXY_HOPS accounting for the login limiter).
  crm:
    build:
      context: ./apps/control
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # Merchant admin on its own domain — proxies /admin and /v1/media to core.
  admin:
    build:
      context: ./apps/admin
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  site:
    build:
      context: .
      dockerfile: storefronts/Dockerfile
      target: site
      args:
        # where "Criar minha loja" goes: the admin's own domain (VENDUA_ADMIN_HOST), https
        PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-https://painel.vendua.com.br}
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

networks:
  # Dokploy's Traefik network — the edge's wildcard route is reached through it
  dokploy-network:
    external: true

volumes:
  pgdata:
  # immutable storefront releases (publish writes, edge reads); unused with an s3:// store
  artifacts:
  edgecache:
