# Dokploy compose (docs: deploy/dokploy.md). `core` is internal-only — storefront
# nginx proxies /storefront/v1, /checkout/v1, /v1 to it, forwarding Host for tenant routing.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vendua
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vendua
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vendua -d vendua']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  core:
    build:
      context: .
      dockerfile: packages/core/Dockerfile
    environment:
      PORT: '8787'
      DATABASE_URL: postgres://vendua_app:${VENDUA_APP_DB_PASSWORD:?set VENDUA_APP_DB_PASSWORD in .env}@db:5432/vendua
      MIGRATION_DATABASE_URL: postgres://vendua:${POSTGRES_PASSWORD}@db:5432/vendua
      VENDUA_APP_DB_PASSWORD: ${VENDUA_APP_DB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # Staff login key for the CRM at /control/ (the login page's "key").
      CONTROL_SECRET: ${CONTROL_SECRET:?set CONTROL_SECRET in .env}
      # Traefik fronts everything — X-Forwarded-* carries routing truth.
      VENDUA_TRUST_PROXY: '1'
      # Chain is client → Traefik → nginx → core; trust nginx's append (1 hop from the right).
      VENDUA_PROXY_HOPS: ${VENDUA_PROXY_HOPS:-1}
      # Merchant admin: stores live at <slug>.<VENDUA_STORE_DOMAIN>.
      VENDUA_STORE_DOMAIN: ${VENDUA_STORE_DOMAIN:-vendua.com.br}
      # The admin's own domain (the `admin` service's); set, no other host serves /admin.
      VENDUA_ADMIN_HOST: ${VENDUA_ADMIN_HOST:-}
      # Web push for new orders (npx web-push generate-vapid-keys); unset = push off, sound still on.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:suporte@vendua.com.br}
      # Ajuda's "chamar no WhatsApp" number (digits); unset = in-app message only.
      VENDUA_SUPPORT_WHATSAPP: ${VENDUA_SUPPORT_WHATSAPP:-}
      # Mercado Pago (docs/deploy/dokploy.md): stores connect by OAuth to this application;
      # unset = stores keep the offline methods. The platform token bills plans (signup needs it).
      MP_CLIENT_ID: ${MP_CLIENT_ID:-}
      MP_CLIENT_SECRET: ${MP_CLIENT_SECRET:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_PLATFORM_ACCESS_TOKEN: ${MP_PLATFORM_ACCESS_TOKEN:-}
      # Seals stores' MP tokens at rest; unset = derived from SESSION_SECRET.
      VENDUA_SECRETS_KEY: ${VENDUA_SECRETS_KEY:-}
      # 1 = seed the three demo tenants + catalog on first boot; 0 = empty.
      SEED_DEMO: ${SEED_DEMO:-1}
      # slug:public-host[,slug:host2] — registers each storefront's real domain at seed time.
      SEED_DOMAINS: ${SEED_DOMAINS:-}
      # Driver reads the key its Config row's secret_ref names; unset = driver reports "ausente".
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Svix signing secret for the inbound email webhook; unset = inbound events rejected.
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      TINYFISH_API_KEY: ${TINYFISH_API_KEY:-}
      VENDUA_WEBHOOK_SECRET: ${VENDUA_WEBHOOK_SECRET:-}
      # monid.ai gateway for the agent's paid enrichment tools — read directly; unset = tools report missing.
      MONID_API_KEY: ${MONID_API_KEY:-}
      # Meeting integrations (optional): B64 SA key for deploy, plain JSON for dev; unset = gcal off, static roomUrl.
      GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON_B64: ${GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON_B64:-}
      GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON: ${GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      DAILY_API_KEY: ${DAILY_API_KEY:-}
      # Instagram DMs via the ig-sidecar service below; the same secret signs both directions.
      IG_SIDECAR_URL: http://ig-sidecar:8790
      IG_SIDECAR_SECRET: ${IG_SIDECAR_SECRET:-}
      # pino level for core itself / the Baileys socket logger.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BAILEYS_LOG_LEVEL: ${BAILEYS_LOG_LEVEL:-warn}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bun -e "fetch(''http://127.0.0.1:8787/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # Every store, one service: Core maps Host → store (domains rows, then <slug>.<VENDUA_STORE_DOMAIN>)
  # and nginx serves that store's bundle, or the `_template` bundle for stores without one.
  # Attach the wildcard domain here once; new stores and bundles need no compose or Dokploy change.
  stores:
    build:
      context: .
      dockerfile: storefronts/Dockerfile
      target: stores
    depends_on:
      core:
        condition: service_healthy
    # Dokploy's Domains form rejects wildcards, so the route lives here. Priority 1 = last:
    # exact hosts set in the Domains UI (admin, crm, site) always win over the wildcard.
    networks: [default, dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.vendua-stores.loadbalancer.server.port=80
      - traefik.http.routers.vendua-stores-http.rule=HostRegexp(`^[a-z0-9-]+\.vendua\.com\.br$$`)
      - traefik.http.routers.vendua-stores-http.entrypoints=web
      - traefik.http.routers.vendua-stores-http.priority=1
      - traefik.http.routers.vendua-stores-http.middlewares=vendua-stores-https
      - traefik.http.middlewares.vendua-stores-https.redirectscheme.scheme=https
      - traefik.http.routers.vendua-stores.rule=HostRegexp(`^[a-z0-9-]+\.vendua\.com\.br$$`)
      - traefik.http.routers.vendua-stores.entrypoints=websecure
      - traefik.http.routers.vendua-stores.priority=1
      - traefik.http.routers.vendua-stores.tls=true
      - traefik.http.routers.vendua-stores.service=vendua-stores
      - traefik.http.routers.vendua-stores-http.service=vendua-stores
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # Instagram DM transport (services/ig-sidecar, Go + mautrix-meta, AGPL-3.0). Internal
  # only: Core pushes the stored session in and it posts signed events back. Without
  # IG_SIDECAR_SECRET it idles and refuses every call.
  ig-sidecar:
    build:
      context: ./services/ig-sidecar
    environment:
      IG_SIDECAR_SECRET: ${IG_SIDECAR_SECRET:-}
      CORE_EVENTS_URL: http://core:8787/control/v1/ig/events
      # static residential proxy (http:// or socks5://) — Instagram flags datacenter IPs
      IG_PROXY: ${IG_PROXY:-}
      IG_MIN_SEND_GAP_SECONDS: ${IG_MIN_SEND_GAP_SECONDS:-20}
      LOG_LEVEL: ${IG_SIDECAR_LOG_LEVEL:-info}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8790/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # Staff CRM — attach the staff domain here, never on core (shortens the proxy
  # chain and breaks VENDUA_PROXY_HOPS accounting for the login limiter).
  crm:
    build:
      context: ./apps/control
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # Merchant admin on its own domain — proxies /admin and /v1/media to core.
  admin:
    build:
      context: ./apps/admin
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  site:
    build:
      context: .
      dockerfile: storefronts/Dockerfile
      target: site
      args:
        # where "Criar minha loja" goes: the admin's own domain (VENDUA_ADMIN_HOST), https
        PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-https://painel.vendua.com.br}
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

networks:
  # Dokploy's Traefik network — the `stores` wildcard route is reached through it
  dokploy-network:
    external: true

volumes:
  pgdata:
