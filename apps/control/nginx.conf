# Venduá CRM — proxies only /control (SPA + /control/v1 API) to the
# internal `core` service. Putting a public domain on this nginx instead of
# directly on core keeps the trusted proxy chain identical to storefront
# traffic (client → Traefik → this nginx → core), so VENDUA_PROXY_HOPS=1
# still resolves the real client IP for the /control/v1/login rate limiter.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    charset utf-8;
    server_tokens off;

    # Behind Traefik: relative redirects keep the public host/port.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/control(/|$) {
        proxy_pass http://core:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
