# Fronts /control for core; keeps the proxy chain identical to storefronts so
# VENDUA_PROXY_HOPS=1 resolves the real client IP for the login rate limiter.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    # stdout/stderr so the container's json-file log driver captures them.
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    charset utf-8;
    server_tokens off;

    # Behind Traefik: relative redirects keep the public host/port.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Docker DNS: resolve `core` per request so recreates don't leave a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Convenience: bare host opens the CRM. Everything else stays 404.
    location = / {
        return 302 /control/;
    }

    location ~ ^/control(/|$) {
        # Variable proxy_pass defers DNS resolution to request time (also forwards URI unchanged).
        set $core_upstream http://core:8787;
        proxy_pass $core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
