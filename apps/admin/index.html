<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f7f4ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a100d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta
      name="description"
      content="O painel da sua loja Venduá: pedidos, cardápio, horários e vendas."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Minha loja" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/admin/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/admin/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/admin/icons/apple-touch-icon.png" />
    <!-- apple-touch-startup-image links: written at build (vite.config.ts) -->
    <title>Minha loja · Venduá</title>
    <script>
      // theme before first paint: the merchant's pick, else the system's
      try {
        var t = localStorage.getItem('vendua-admin-theme');
        var dark =
          t === 'noite' ||
          ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'noite' : 'creme';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // nothing rendered after 10s (a stale service worker or cache pinned a broken version):
      // drop them and load fresh, once a minute at most
      setTimeout(function () {
        var r = document.getElementById('root');
        if (!r || r.childNodes.length) return;
        try {
          var k = 'vendua-admin-rescued';
          if (Date.now() - Number(sessionStorage.getItem(k) || 0) < 60000) return;
          sessionStorage.setItem(k, String(Date.now()));
        } catch (e) {
          return;
        }
        var done = function () {
          location.reload();
        };
        Promise.all([
          navigator.serviceWorker
            ? navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(
                  rs.map(function (x) {
                    return x.unregister();
                  }),
                );
              })
            : 0,
          window.caches
            ? caches.keys().then(function (ks) {
                return Promise.all(
                  ks.map(function (x) {
                    return caches.delete(x);
                  }),
                );
              })
            : 0,
        ]).then(done, done);
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
