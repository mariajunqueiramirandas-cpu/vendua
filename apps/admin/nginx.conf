# Fronts /admin for core on the admin's own domain; keeps the proxy chain identical to
# storefronts so VENDUA_PROXY_HOPS=1 resolves the real client IP for the sign-in limiter.

# Log only failures — 2xx/3xx lines are one per asset/API call and drown the rest.
map $status $vendua_loggable {
    ~^[23]  0;
    default 1;
}

# Traefik terminates TLS: pass its scheme on (Core marks cookies Secure from it); direct hits keep ours.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# HSTS only on responses that went out over TLS — a plain-http local run never pins itself.
map $fwd_proto $vendua_hsts {
    https   "max-age=31536000";
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    access_log /dev/stdout combined if=$vendua_loggable;
    error_log /dev/stderr warn;
    charset utf-8;
    server_tokens off;

    # Behind Traefik: relative redirects keep the public host/port.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # nothing else may frame the admin
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    # empty (plain http) = header not sent
    add_header Strict-Transport-Security $vendua_hsts always;

    # Docker DNS: resolve `core` per request so recreates don't leave a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = / {
        return 302 /admin/;
    }

    # The app, its API and SSE stream, plus the product photos it shows.
    location ~ ^/(admin|v1/media)(/|$) {
        set $core_upstream http://core:8787;
        proxy_pass $core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # /admin/v1/events is a long-lived SSE stream
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        return 404;
    }
}
